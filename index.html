// FINANCEIRO GERAL — Pilates + Fisio + Loja
// ═══════════════════════════════════════════════════════════
async function rFinGeral(){
  set('<div class="pt">Financeiro Geral</div><div class="ps">Consolidado de todas as receitas — Pilates · Fisioterapia · Loja</div>'+
  '<div style="display:flex;align-items:center;justify-content:center;height:200px;flex-direction:column;gap:10px;color:var(--text-2)">'+
  '<div style="width:28px;height:28px;border:3px solid var(--border-md);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite"></div>'+
  '<span style="font-size:12px">Consolidando dados…</span></div>');

  // Busca tudo em PARALELO com timeout de 8s cada
  const safe = (p) => p.catch(()=>null);
  const [resAlunos, resPags, resVendas, resPacientes] = await Promise.all([
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/alunos?select=*&limit=500`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/pagamentos?select=*&limit=1000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/vendas?select=*&limit=1000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/pacientes_fisio?select=*&limit=200`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
  ]);

  // Busca extras em paralelo
  const [resSessoes, resLogs] = await Promise.all([
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/sessoes_fisio?select=*&order=data_sessao&limit=2000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/logs_alteracoes?tabela=eq.alunos&order=criado_em.desc&limit=1000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
  ]);
  window._sessFisio  = resSessoes ? await resSessoes.json().catch(()=>[]) : [];
  window._logsAlunos = resLogs    ? await resLogs.json().catch(()=>[])    : [];

  // Parseia respostas — fallback para dados em cache/local se falhar
  const alunosBanco   = resAlunos   ? await resAlunos.json().catch(()=>[])   : [];
  const pagsBanco     = resPags     ? await resPags.json().catch(()=>[])     : [];
  const vendasBanco   = resVendas   ? await resVendas.json().catch(()=>[])   : [];
  const pacientesBanco= resPacientes? await resPacientes.json().catch(()=>[])  : [];

  // ── PILATES — banco com fallback cache/local ──────────────
  const alunosBase = alunosBanco.length > 0
    ? alunosBanco.map(r=>({n:r.nome,s:r.status,v:parseFloat(r.valor)||0,pl:r.plano,h:r.horario,pg:r.ultimo_pagto,px:r.prox_vencto}))
    : (window._alunosDB||AL);

  const ativos = alunosBase.filter(a=>a.s==='A');
  const recMensal = ativos.reduce((s,a)=>s+(parseFloat(a.v)||0),0);

  // Vencimentos por mês atual e próximo
  const agora    = new Date();
  const mesAtual = agora.getMonth()+1;
  const mesProx  = mesAtual===12?1:mesAtual+1;

  const vMes  = ativos.filter(a=>{if(!a.px||a.px==='parceria')return false;const p=(a.px||'').split('/');return parseInt(p[1])===mesAtual;});
  const vProx = ativos.filter(a=>{if(!a.px||a.px==='parceria')return false;const p=(a.px||'').split('/');return parseInt(p[1])===mesProx;});
  const semData  = ativos.filter(a=>!a.px||a.px==='parceria').length;
  const vencidos = ativos.filter(a=>vencido(a.px));

  const nomeMes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const porPlano={};
  ativos.forEach(a=>{
    const pl=(a.pl||'—').split(' ').slice(0,2).join(' ');
    if(!porPlano[pl]) porPlano[pl]={n:0,rec:0};
    porPlano[pl].n++; porPlano[pl].rec+=(parseFloat(a.v)||0);
  });
  const planosTop=Object.entries(porPlano).sort((a,b)=>b[1].rec-a[1].rec);

  const pagReg   = pagsBanco.length;
  const pagTotal = pagsBanco.reduce((s,p)=>s+(parseFloat(p.valor)||0),0);

  // ── FISIOTERAPIA ─────────────────────────────────────────
  const fisioBase = pacientesBanco.length > 0
    ? pacientesBanco.map(r=>({n:r.nome,sessoes:r.sessoes_contratadas,realizadas:r.sessoes_realizadas||0,status:r.status}))
    : (window._fisioCache||FISIO);

  const PRECO_SESSAO = 145;
  const totalSessoes  = fisioBase.reduce((s,p)=>s+(p.realizadas||0),0);
  const pacAtivos     = fisioBase.filter(p=>p.status!=='alta').length;
  const pacConc       = fisioBase.filter(p=>p.sessoes&&p.realizadas>=p.sessoes).length;
  const pacAndamento  = fisioBase.filter(p=>p.status!=='alta'&&p.realizadas>0&&(!p.sessoes||p.realizadas<p.sessoes)).length;

  // Sessões do mês atual
  const mesN = agora.getMonth()+1, anoN = agora.getFullYear();
  function isMesAtual(dataStr){
    if(!dataStr) return false;
    const s=String(dataStr).split('T')[0];
    const [y,m]=s.split('-');
    return parseInt(m)===mesN && parseInt(y)===anoN;
  }
  function isMesAtualDDMM(dataStr){
    if(!dataStr) return false;
    const s=String(dataStr);
    if(s.match(/^\d{4}-\d{2}/)) return isMesAtual(s);
    const p=s.split('/');
    if(p.length<3) return false;
    const ano=p[2].length===4?parseInt(p[2]):parseInt('20'+p[2]);
    return parseInt(p[1])===mesN && ano===anoN;
  }
  const sessoesMes = (window._sessFisio||[]).filter(s=>isMesAtual(s.data_sessao));
  const recFisioMes = sessoesMes.length * PRECO_SESSAO;
  const recFisio = totalSessoes * PRECO_SESSAO; // acumulado para referência

  // ── LOJA ─────────────────────────────────────────────────
  const todasVendas = vendasBanco.map(r=>({
    item:r.item,marca:r.marca,
    preco:parseFloat(r.preco)||0,
    custo:parseFloat(r.custo)||0,
    data:r.data_venda,
    vendedor:r.vendedor,
    participacao_vitoria:r.participacao_vitoria
  }));
  const vendasMes  = todasVendas.filter(v=>isMesAtualDDMM(v.data));
  const recLojaMes = vendasMes.reduce((s,v)=>s+v.preco,0);
  const recLoja    = todasVendas.reduce((s,v)=>s+v.preco,0);
  const custoLoja  = todasVendas.filter(v=>v.custo>0).reduce((s,v)=>s+v.custo,0);
  const margemLoja = custoLoja>0?((recLoja-custoLoja)/recLoja*100):null;
  const recEnc    = ENCOMENDAS.filter(e=>e.vf).reduce((s,e)=>s+(parseFloat(e.vf)||0),0);
  const encPend   = ENCOMENDAS.filter(e=>!e.vf).length;

  const porMarca={};
  todasVendas.forEach(v=>{const m=v.marca||'Outras';if(!porMarca[m])porMarca[m]=0;porMarca[m]+=v.preco;});
  const marcasTop=Object.entries(porMarca).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxM=marcasTop[0]?marcasTop[0][1]:1;

  // ── TOTAL GERAL ───────────────────────────────────────────
  const totalGeral = recMensal + recFisioMes + recLojaMes + recEnc;
  const maxBar = Math.max(recMensal, recFisioMes, recLojaMes+recEnc) || 1;

  function barraH(val, max, cor){
    const pct = Math.round(val/max*100);
    return `<div style="height:8px;border-radius:4px;background:#EDE0CC;margin-top:4px"><div style="width:${pct}%;height:100%;border-radius:4px;background:${cor}"></div></div>`;
  }

  set(
  '<div class="pt">Financeiro Geral</div>'+
  '<div class="ps">Consolidado de todas as receitas — Pilates · Fisioterapia · Loja</div>'+

  // ── TOTAIS ────────────────────────────────────────────────
  '<div style="background:#FDF8F2;border:.5px solid rgba(184,146,74,.3);border-radius:14px;padding:18px;margin-bottom:16px;display:flex;align-items:center;gap:20px">'+
  '<div style="flex:1"><div style="font-size:11px;color:#7A5230;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Receita total estimada/mês</div>'+
  '<div style="font-size:32px;font-weight:700;color:#B8924A">R$ '+Math.round(recMensal+recFisioMes).toLocaleString('pt-BR')+'</div>'+
  '<div style="font-size:11px;color:#7A5230;margin-top:2px">Pilates + Fisioterapia (recorrente)</div></div>'+
  '<div style="text-align:right"><div style="font-size:11px;color:#7A5230;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Loja (acumulado)</div>'+
  '<div style="font-size:20px;font-weight:700;color:#7A5230">R$ '+Math.round(recLojaMes+recEnc).toLocaleString('pt-BR')+'</div>'+
  '<div style="font-size:11px;color:#7A5230;margin-top:2px">Vendas + encomendas recebidas</div></div>'+
  '</div>'+

  // ── 3 BLOCOS ──────────────────────────────────────────────
  '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px">'+

  // PILATES
  '<div style="background:#FDF8F2;border:.5px solid rgba(184,146,74,.25);border-radius:12px;padding:14px">'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+
  '<div style="width:32px;height:32px;border-radius:8px;background:#B8924A22;display:flex;align-items:center;justify-content:center">'+
  '<i class="ti ti-yoga" style="font-size:16px;color:#B8924A"></i></div>'+
  '<div style="font-size:13px;font-weight:600;color:#4A2E1A">Pilates</div></div>'+
  '<div style="font-size:22px;font-weight:700;color:#B8924A;margin-bottom:2px">R$ '+recMensal.toLocaleString('pt-BR')+'</div>'+
  '<div style="font-size:11px;color:#7A5230;margin-bottom:12px">estimativa mensal · '+ativos.length+' alunos ativos</div>'+
  barraH(recMensal,maxBar,'#B8924A')+
  '<div style="margin-top:12px;display:flex;flex-direction:column;gap:5px">'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Vencem em '+nomeMes[mesAtual]+'</span><span style="font-weight:600;color:var(--text-1)">'+vMes.length+' alunos</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Vencem em '+nomeMes[mesProx]+'</span><span style="font-weight:600;color:var(--text-1)">'+vProx.length+' alunos</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Sem data cadastrada</span><span style="font-weight:600;color:#C0392B">'+semData+' alunos</span></div>'+
  (vencidos.length?'<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:#C0392B">Vencidos</span><span style="font-weight:600;color:#C0392B">'+vencidos.length+' alunos</span></div>':'')+
  (pagReg>0?'<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Pgtos registrados</span><span style="font-weight:600;color:#2D7A3A">'+pagReg+' · R$ '+Math.round(pagTotal).toLocaleString('pt-BR')+'</span></div>':'')+
  '</div></div>'+

  // FISIOTERAPIA
  '<div style="background:#FDF8F2;border:.5px solid rgba(184,146,74,.25);border-radius:12px;padding:14px">'+
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'+
  '<div style="width:32px;height:32px;border-radius:8px;background:#6B7A2E22;display:flex;align-items:center;justify-content:center">'+
  '<i class="ti ti-heart-rate-monitor" style="font-size:16px;color:#6B7A2E"></i></div>'+
  '<div style="font-size:13px;font-weight:600;color:#4A2E1A">Fisioterapia</div></div>'+
  '<div style="font-size:22px;font-weight:700;color:#6B7A2E;margin-bottom:2px">R$ '+Math.round(recFisioMes).toLocaleString('pt-BR')+'</div>'+
  '<div style="font-size:11px;color:#7A5230;margin-bottom:12px">mês atual · '+sessoesMes.length+' sessões × R$ '+PRECO_SESSAO+'</div>'+
  barraH(recFisioMes,maxBar,'#6B7A2E')+
  '<div style="margin-top:12px;display:flex;flex-direction:column;gap:5px">'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Total de sessões</span><span style="font-weight:600;color:var(--text-1)">'+totalSessoes+' sessões</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Pacientes ativos</span><span style="font-weight:600;color:var(--text-1)">'+pacAtivos+'</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Tratamentos concluídos</span><span style="font-weight:600;color:#2D7A3A">'+pacConc+'</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px"><span style="color:var(--text-2)">Em andamento</span><span style="font-weight:600;color:var(--text-1)">'+pacAndamento+'</span></div>'+

function blocoComissaoVitoria(todasVendas){
  // Vendas por mês
  const agora = new Date();
  const nomesMes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  // Agrupa por mês
  const porMes = {};
  todasVendas.forEach(v=>{
    if(!v.data) return;
    const s = String(v.data);
    let mes, ano;
    if(s.match(/^\d{4}-\d{2}/)){
      const [y,m] = s.split('-');
      mes=parseInt(m); ano=parseInt(y);
    } else {
      const p = s.split('/');
      if(p.length<3) return;
      mes=parseInt(p[1]); ano=parseInt('20'+p[2]);
    }
    const key = String(mes).padStart(2,'0')+'/'+ano;
    if(!porMes[key]) porMes[key]={ total:0, vitoria:0, provador:0, qtdTotal:0, qtdVitoria:0, qtdProvador:0 };
    porMes[key].total += parseFloat(v.preco)||0;
    porMes[key].qtdTotal++;
    if(v.participacao_vitoria==='atendeu' || v.vendedor==='Vitoria'){
      porMes[key].vitoria += parseFloat(v.preco)||0;
      porMes[key].qtdVitoria++;
    } else if(v.participacao_vitoria==='provador'){
      porMes[key].provador += parseFloat(v.preco)||0;
      porMes[key].qtdProvador++;
    }
  });

  const meses = Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  if(!meses.length) return '';

  const mesAtualKey = String(agora.getMonth()+1).padStart(2,'0')+'/'+agora.getFullYear();

  return '<div style="font-size:11px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px">'+
  '<i class="ti ti-percentage"></i> Comissão — Vitória</div>'+
  '<div class="tw"><table><thead><tr>'+
  '<th>Mês</th><th>Total loja</th><th>Vendas Vitória</th><th>Comissão</th><th>Valor a pagar</th>'+
  '</tr></thead><tbody>'+
  meses.map(([key,d])=>{
    const [mm,yyyy] = key.split('/');
    const isAtual = key===mesAtualKey;
    // Regra simplificada:
    // - Atendeu → sempre 5%
    // - Provador/indicação → sempre 3%
    const comAtendeu = d.vitoria * 0.05;
    const comProvador = d.provador * 0.03;
    const comTotal = comAtendeu + comProvador;
    const pct = d.total>0 ? (d.vitoria/d.total*100) : 0;

    return '<tr style="'+(isAtual?'background:rgba(201,169,110,.05)':'')+'">'+
    '<td style="font-weight:'+(isAtual?700:400)+'">'+nomesMes[parseInt(mm)]+' '+yyyy+
      (isAtual?' <span style="font-size:10px;color:var(--gold-dark)">● atual</span>':'')+
    '</td>'+
    '<td>'+fR(d.total)+'<span style="font-size:10px;color:var(--text-3);margin-left:4px">'+d.qtdTotal+' vendas</span></td>'+
    '<td>'+
      (d.vitoria>0?'<div style="font-size:12px;font-weight:500;color:var(--text-1)">Atendeu: '+fR(d.vitoria)+' <span style="color:var(--text-3)">('+d.qtdVitoria+' vendas)</span></div>':'')+
      (d.provador>0?'<div style="font-size:12px;color:var(--text-2)">Provador: '+fR(d.provador)+' <span style="color:var(--text-3)">('+d.qtdProvador+')</span></div>':'')+
      (d.vitoria===0&&d.provador===0?'<span style="color:var(--text-3)">—</span>':'')+
    '</td>'+
    '<td>'+
      (d.vitoria>0?'<span class="bdg bg">5%</span>':'')+
      (d.provador>0?'<span class="bdg ba" style="margin-left:4px">3%</span>':'')+
      (d.vitoria===0&&d.provador===0?'<span style="color:var(--text-3)">—</span>':'')+
    '</td>'+
    '<td style="font-weight:700;color:'+(comTotal>0?'#2D7A3A':'var(--text-3)')+'">'+fR(comTotal)+
      (isAtual&&comTotal>0?'<span style="font-size:10px;color:var(--text-3);display:block">parcial</span>':'')+
    '</td>'+
    '</tr>';
  }).join('')+
  '</tbody></table>'+
  '<div style="padding:10px 16px;font-size:12px;color:var(--text-3);border-top:1px solid var(--border)">'+
  '<i class="ti ti-info-circle"></i> Regra: vendas que Vitória atendeu → 5% · provador/indicação → 3%'+
  '</div></div>';
}

function blocoMensalConsolidado(pagamentos, vendas, sessoesFisio, logsAlunos){
  const agora = new Date();
  const nomesMes = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const PRECO_SESSAO_FISIO = 145;

  function parseMesAno(data){
    if(!data||data==='—'||data==='null'||data===null) return null;
    const s=String(data);
    if(s.match(/^\d{4}-\d{2}/)){
      const [y,m]=s.split('-');
      return String(parseInt(m)).padStart(2,'0')+'/'+y;
    }
    const p=s.split('/');
    if(p.length<3) return null;
    const ano=p[2].length===4?p[2]:'20'+p[2];
    return p[1].padStart(2,'0')+'/'+ano;
  }

  // Usa logs para rastrear novos cadastros e pausamentos por mês
  const novosPorMes = {};
  const pausadosPorMes = {};

  logsAlunos.forEach(l=>{
    const key = parseMesAno(l.criado_em);
    if(!key) return;
    if(l.acao==='cadastrou aluno'||l.acao==='converteu para ativo'){
      if(!novosPorMes[key]) novosPorMes[key]=0;
      novosPorMes[key]++;
    }
    if(l.acao==='pausou aluno'){
      if(!pausadosPorMes[key]) pausadosPorMes[key]=0;
      pausadosPorMes[key]++;
    }
  });

  const porMes={};
  const addMes=(key)=>{ if(!porMes[key]) porMes[key]={pilates:0,qtdPilates:0,loja:0,qtdLoja:0,fisio:0,qtdFisio:0}; };

  pagamentos.forEach(p=>{
    const key=parseMesAno(p.data_pgto); if(!key) return;
    addMes(key);
    porMes[key].pilates += parseFloat(p.valor)||0;
    porMes[key].qtdPilates++;
  });

  vendas.forEach(v=>{
    const key=parseMesAno(v.data); if(!key) return;
    addMes(key);
    porMes[key].loja += parseFloat(v.preco)||0;
    porMes[key].qtdLoja++;
  });

  // Sessões de fisioterapia por mês
  (sessoesFisio||[]).forEach(s=>{
    const key=parseMesAno(s.data_sessao); if(!key) return;
    addMes(key);
    porMes[key].fisio += PRECO_SESSAO_FISIO;
    porMes[key].qtdFisio++;
  });

  const meses=Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);
  if(!meses.length) return '';

  const mesAtualKey=String(agora.getMonth()+1).padStart(2,'0')+'/'+agora.getFullYear();
  const totalPilates=meses.reduce((s,[,d])=>s+d.pilates,0);
  const totalFisio  =meses.reduce((s,[,d])=>s+d.fisio,0);
  const totalLoja   =meses.reduce((s,[,d])=>s+d.loja,0);
  const totalGeral  =totalPilates+totalFisio+totalLoja;

  return '<div style="font-size:11px;font-weight:700;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 10px">'+
  '<i class="ti ti-calendar-stats"></i> Consolidado mensal — Receitas</div>'+

  '<div class="metrics3" style="margin-bottom:14px">'+
  mc('Total acumulado','vg',fR(totalGeral),meses.length+' meses')+
  mc('Pilates','va',fR(totalPilates),meses.reduce((s,[,d])=>s+d.qtdPilates,0)+' pgtos')+
  mc('Fisio + Loja','vp',fR(totalFisio+totalLoja),meses.reduce((s,[,d])=>s+d.qtdFisio+d.qtdLoja,0)+' itens')+
  '</div>'+

  '<div class="tw"><table><thead><tr>'+
  '<th>Mês</th><th>Pilates</th><th>Fisioterapia</th><th>Loja</th><th style="font-weight:700">Total</th><th>Novos</th><th>Pausados</th><th></th>'+
  '</tr></thead><tbody>'+
  meses.map(([key,d])=>{
    const [mm,yyyy]=key.split('/');
    const isAtual=key===mesAtualKey;
    const total=d.pilates+d.fisio+d.loja;
    const novos   = novosPorMes[key]||0;
    const pausados= pausadosPorMes[key]||0;
    return '<tr style="'+(isAtual?'background:rgba(201,169,110,.05)':'')+'">'+
    '<td style="font-weight:'+(isAtual?700:500)+';white-space:nowrap">'+
      nomesMes[parseInt(mm)]+' '+yyyy+
      (isAtual?' <span class="bdg ba" style="font-size:9px">atual</span>':'')+
    '</td>'+
    '<td>'+
      '<div style="font-weight:600;color:var(--gold-dark)">'+fR(d.pilates)+'</div>'+
      '<div style="font-size:10px;color:var(--text-3)">'+d.qtdPilates+' pgtos</div>'+
    '</td>'+
    '<td>'+
      (d.fisio>0?
        '<div style="font-weight:600;color:#3D7A3A">'+fR(d.fisio)+'</div>'+
        '<div style="font-size:10px;color:var(--text-3)">'+d.qtdFisio+' sessões</div>'
      :'<span style="color:var(--text-3)">—</span>')+
    '</td>'+
    '<td>'+
      (d.loja>0?
        '<div style="font-weight:600;color:var(--brown-mid)">'+fR(d.loja)+'</div>'+
        '<div style="font-size:10px;color:var(--text-3)">'+d.qtdLoja+' vendas</div>'
      :'<span style="color:var(--text-3)">—</span>')+
    '</td>'+
    '<td style="font-weight:700;color:var(--text-1);font-size:14px">'+fR(total)+'</td>'+
    '<td>'+(novos>0?'<span class="bdg bg" style="font-size:11px">+'+novos+'</span>':'<span style="color:var(--text-3)">—</span>')+'</td>'+
    '<td>'+(pausados>0?'<span class="bdg ba" style="font-size:11px">'+pausados+'</span>':'<span style="color:var(--text-3)">—</span>')+'</td>'+
    '<td style="font-size:10px;color:var(--text-3)">'+(isAtual?'parcial':'')+'</td>'+
    '</tr>';
  }).join('')+
  '<tr class="sum-row">'+
  '<td style="font-weight:700">Total geral</td>'+
  '<td style="font-weight:700;color:var(--gold-dark)">'+fR(totalPilates)+'</td>'+
  '<td style="font-weight:700;color:#3D7A3A">'+fR(totalFisio)+'</td>'+
  '<td style="font-weight:700;color:var(--brown-mid)">'+fR(totalLoja)+'</td>'+
  '<td style="font-weight:700;color:var(--text-1);font-size:14px">'+fR(totalGeral)+'</td>'+
  '<td style="font-weight:700;color:#2D7A3A">+'+Object.values(novosPorMes).reduce((s,n)=>s+n,0)+'</td>'+
  '<td style="font-weight:700;color:var(--gold-dark)">'+Object.values(pausadosPorMes).reduce((s,n)=>s+n,0)+'</td>'+
  '<td></td>'+
  '</tr>'+
  '</tbody></table></div>';
}

async function navDRE(){
  set('<div class="pt">DRE & Metas</div><div class="ps">Carregando dados…</div>'+
  '<div style="display:flex;align-items:center;justify-content:center;height:120px">'+
  '<div style="width:24px;height:24px;border:3px solid var(--border-md);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div></div>');

  const agora   = new Date();
  const mesAtual = agora.getMonth()+1;
  const anoAtual = agora.getFullYear();

  // Busca dados em paralelo
  const safe = p=>p.catch(()=>null);
  const [rPags, rVendas, rSessoes, rDesp] = await Promise.all([
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/pagamentos?select=*&limit=2000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/vendas?select=*&limit=2000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/sessoes_fisio?select=*&limit=2000`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
    safe(fetchWithTimeout(`${SB_URL}/rest/v1/despesas?select=*&order=ano.desc,mes.desc&limit=500`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}},8000)),
  ]);

  const pags    = rPags    ? await rPags.json().catch(()=>[])    : [];
  const vendas  = rVendas  ? await rVendas.json().catch(()=>[])  : [];
  const sessoes = rSessoes ? await rSessoes.json().catch(()=>[]) : [];
  const despExtra = rDesp  ? await rDesp.json().catch(()=>[])   : [];

  // ── Agrupa receitas por mês ────────────────────────────────
  function getMesAno(s){
    if(!s) return null;
    const str=String(s);
    if(str.match(/^\d{4}-\d{2}/)){const[y,m]=str.split('-');return{m:parseInt(m),y:parseInt(y)};}
    const p=str.split('/'); if(p.length<3) return null;
    return{m:parseInt(p[1]),y:p[2].length===4?parseInt(p[2]):parseInt('20'+p[2])};
  }

  // Meses a partir de junho/2026 até hoje + 3 meses futuros
  const INICIO_MES = 6, INICIO_ANO = 2026;
  const mesesSet = new Set();
  let d = new Date(INICIO_ANO, INICIO_MES-1, 1);
  while(d <= new Date(anoAtual, mesAtual-1, 1)){
    mesesSet.add(`${d.getMonth()+1}/${d.getFullYear()}`);
    d.setMonth(d.getMonth()+1);
  }
  // 3 meses futuros
  for(let i=1;i<=3;i++){
    const df=new Date(anoAtual,mesAtual-1+i,1);
    mesesSet.add(`${df.getMonth()+1}/${df.getFullYear()}`);
  }

  const mesesOrdenados = [...mesesSet].sort((a,b)=>{
    const[ma,ya]=a.split('/').map(Number);
    const[mb,yb]=b.split('/').map(Number);
    return ya!==yb?ya-yb:ma-mb;
  });

  // Calcula receitas por mês
  function receitasMes(m,y){
    const pilates = pags.filter(p=>{const d=getMesAno(p.data_pgto);return d&&d.m===m&&d.y===y;}).reduce((s,p)=>s+(parseFloat(p.valor)||0),0);
    const loja    = vendas.filter(v=>{const d=getMesAno(v.data_venda);return d&&d.m===m&&d.y===y;}).reduce((s,v)=>s+(parseFloat(v.preco)||0),0);
    const fisioSist = sessoes.filter(s=>{const d=getMesAno(s.data_sessao);return d&&d.m===m&&d.y===y;}).length * 145;
    // Larissa domicílio: João R$1.300 + Elisangela R$1.800 = R$3.100 fixo
    const fisioLarissa = LARISSA_FISIO_MENSAL;
    const fisio = fisioSist + fisioLarissa;
    return{pilates,loja,fisioSist,fisioLarissa,fisio,total:pilates+loja+fisio};
  }

  // Despesas extras do banco por mês
  function despesasMes(m,y){
    return despExtra.filter(d=>d.mes===m&&d.ano===y).reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
  }

  // Crescimento médio da fisio (últimos 3 meses com dados) — conservador
  const fisioHist = [];
  for(let i=3;i>=1;i--){
    const d=new Date(anoAtual,mesAtual-1-i,1);
    const r=receitasMes(d.getMonth()+1,d.getFullYear());
    if(r.fisioSist > 0) fisioHist.push(r.fisioSist);
  }

  // ── Mês atual detalhado — deve vir ANTES do crescFisio ─────
  const recAtual = receitasMes(mesAtual, anoAtual);

  // Crescimento = variação entre primeiro e último mês com dados / quantidade de meses
  // Limita a crescimento máximo de 10% do valor atual de fisio
  const crescBruto = fisioHist.length>=2
    ? (fisioHist[fisioHist.length-1]-fisioHist[0])/(fisioHist.length-1)
    : 0;
  const crescFisio = Math.min(Math.max(crescBruto, 0), recAtual.fisioSist * 0.10);

  const despExtAtual = despesasMes(mesAtual, anoAtual);
  const impostAtual  = Math.round(recAtual.total * TAXA_SIMPLES);
  const totalDesp    = TOTAL_FIXO + despExtAtual + impostAtual;
  const lucroAtual   = recAtual.total - totalDesp;

  // % da meta (mês atual)
  const pctMeta = Math.min(100, Math.round(lucroAtual/META_LUCRO*100));
  const pctReceita = Math.min(100, Math.round(recAtual.total/(META_LUCRO+TOTAL_FIXO)*100));
  const diasMes = new Date(anoAtual,mesAtual,0).getDate();
  const diasPassados = agora.getDate();
  const pctMes = Math.round(diasPassados/diasMes*100);
  // Projeção do mês (extrapolação linear)
  const projecaoReceita = diasPassados>0 ? Math.round(recAtual.total/diasPassados*diasMes) : 0;
  const projecaoLucro   = projecaoReceita - totalDesp;

  const nomesMes=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // ── RENDER ────────────────────────────────────────────────
  set(
  '<div class="pt">DRE & Metas</div>'+
  '<div class="ps">Demonstrativo de Resultado — Simples Nacional · Meta de lucro líquido: '+fR(META_LUCRO)+'</div>'+

  // ── META DO MÊS ──────────────────────────────────────────
  '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)">'+
  '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">'+
  '<div>'+
  '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)">Meta de lucro — '+nomesMes[mesAtual]+'/'+anoAtual+'</div>'+
  '<div style="font-size:32px;font-weight:800;color:'+(lucroAtual>=0?'#2D7A3A':'#C0392B')+'">'+fR(lucroAtual)+'</div>'+
  '<div style="font-size:12px;color:var(--text-2);margin-top:2px">Lucro atual · dia '+diasPassados+' de '+diasMes+' ('+pctMes+'% do mês)</div>'+
  '</div>'+
  '<div style="text-align:right">'+
  '<div style="font-size:11px;color:var(--text-3)">Projeção ao fim do mês</div>'+
  '<div style="font-size:22px;font-weight:700;color:'+(projecaoLucro>=META_LUCRO?'#2D7A3A':projecaoLucro>=0?'var(--gold-dark)':'#C0392B')+'">'+fR(projecaoLucro)+'</div>'+
  '<div style="font-size:11px;color:var(--text-3)">meta: '+fR(META_LUCRO)+'</div>'+
  '</div></div>'+

  // Barra meta lucro
  '<div style="margin-bottom:8px">'+
  '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:4px">'+
  '<span>Lucro líquido</span><span style="font-weight:700;color:'+(pctMeta>=100?'#2D7A3A':pctMeta>=70?'var(--gold-dark)':'#C0392B')+'">'+pctMeta+'% da meta</span></div>'+
  '<div style="height:12px;border-radius:6px;background:var(--bg-2);position:relative">'+
  '<div style="width:'+pctMeta+'%;height:100%;border-radius:6px;background:'+(pctMeta>=100?'#2D7A3A':pctMeta>=70?'#C9A96E':'#C0392B')+';transition:width .5s"></div>'+
  // Linha de progresso do mês
  '<div style="position:absolute;top:-4px;left:'+pctMes+'%;width:2px;height:20px;background:var(--text-3);border-radius:1px" title="Hoje"></div>'+
  '</div>'+
  '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);margin-top:2px"><span>R$ 0</span><span>▲ hoje ('+pctMes+'%)</span><span>'+fR(META_LUCRO)+'</span></div>'+
  '</div>'+

  // Barra receita
  '<div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:4px">'+
  '<span>Receita bruta</span><span style="font-weight:700">'+fR(recAtual.total)+' → projeção '+fR(projecaoReceita)+'</span></div>'+
  '<div style="height:8px;border-radius:4px;background:var(--bg-2)">'+
  '<div style="width:'+pctReceita+'%;height:100%;border-radius:4px;background:var(--gold)"></div></div>'+
  '</div></div>'+

  // ── DRE MÊS ATUAL ─────────────────────────────────────────
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">'+

  // Receitas
  '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px">'+
  '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">📈 Receitas — '+nomesMes[mesAtual]+'</div>'+
  dreRow('Pilates',fR(recAtual.pilates),'#2D7A3A')+
  dreRow('Fisio (estúdio)',fR(recAtual.fisioSist),'#2D7A3A')+
  dreRow('Fisio domicílio — Larissa',fR(LARISSA_FISIO_MENSAL),'#2D7A3A')+
  dreRow('Loja',fR(recAtual.loja),'#2D7A3A')+
  '<div style="border-top:2px solid var(--border);margin:10px 0"></div>'+
  dreRow('RECEITA BRUTA',fR(recAtual.total),'#2D7A3A',true)+
  '</div>'+

  // Despesas
  '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px">'+
  '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">📉 Despesas — '+nomesMes[mesAtual]+'</div>'+
  DESPESAS_FIXAS.map(d=>dreRow(d.descricao,fR(d.valor),'#C0392B')).join('')+
  dreRow('Simples Nacional (6%)',fR(impostAtual),'#7D6608')+
  (despExtAtual>0?dreRow('Despesas extras',fR(despExtAtual),'#C0392B'):'')+
  '<div style="border-top:2px solid var(--border);margin:10px 0"></div>'+
  dreRow('TOTAL DESPESAS',fR(totalDesp),'#C0392B',true)+
  '<div style="border-top:2px solid var(--border);margin:10px 0"></div>'+
  dreRow('LUCRO LÍQUIDO',fR(lucroAtual),lucroAtual>=0?'#2D7A3A':'#C0392B',true)+
  '<button class="btn btns" style="margin-top:10px;width:100%;justify-content:center" onclick="abrirLancarDespesa()"><i class="ti ti-plus"></i> Lançar despesa extra</button>'+
  '</div></div>'+

  // ── HISTÓRICO + PREVISÃO ──────────────────────────────────
  '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Histórico & Previsão</div>'+
  '<div class="tw"><table><thead><tr>'+
  '<th>Mês</th><th>Pilates</th><th>Fisio</th><th>Loja</th><th>Receita Bruta</th><th>Despesas</th><th>Imposto</th><th style="font-weight:700">Lucro Líquido</th>'+
  '</tr></thead><tbody>'+
  mesesOrdenados.map(key=>{
    const[m,y]=key.split('/').map(Number);
    const isFuturo = y>anoAtual||(y===anoAtual&&m>mesAtual);
    const isAtual  = m===mesAtual&&y===anoAtual;
    const rec = isFuturo ? previsaoMes(m,y,recAtual,crescFisio,pags,vendas,sessoes) : receitasMes(m,y);
    const despE= isFuturo ? 0 : despesasMes(m,y);
    const imp  = Math.round(rec.total*TAXA_SIMPLES);
    const desp = TOTAL_FIXO + despE + imp;
    const lucro= rec.total - desp;
    return '<tr style="'+(isAtual?'background:rgba(201,169,110,.06);font-weight:600':isFuturo?'background:rgba(45,122,58,.03);color:var(--text-2);font-style:italic':'')+'">'+
    '<td style="white-space:nowrap">'+nomesMes[m]+' '+y+(isAtual?' <span class="bdg ba" style="font-size:9px">atual</span>':isFuturo?' <span class="bdg bg" style="font-size:9px">previsão</span>':'')+'</td>'+
    '<td>'+fR(rec.pilates)+'</td>'+
    '<td>'+fR(rec.fisio)+(isFuturo?'<span style="font-size:9px;color:var(--gold-dark);margin-left:3px">↗</span>':'')+'</td>'+
    '<td>'+fR(rec.loja)+'</td>'+
    '<td style="font-weight:600">'+fR(rec.total)+'</td>'+
    '<td style="color:#C0392B">'+fR(desp)+'</td>'+
    '<td style="color:#7D6608">'+fR(imp)+'</td>'+
    '<td style="font-weight:700;color:'+(lucro>=META_LUCRO?'#2D7A3A':lucro>=0?'var(--gold-dark)':'#C0392B')+'">'+fR(lucro)+
    (lucro>=META_LUCRO?' ✓':'')+
    '</td></tr>';
  }).join('')+
  '</tbody></table></div>'+
  '<div style="font-size:11px;color:var(--text-3);margin-top:6px">'+
  '<i class="ti ti-info-circle"></i> Previsão de fisio baseada no crescimento médio dos últimos 3 meses ('+fR(crescFisio)+'/mês). Despesas fixas aplicadas em todos os meses.'+
  '</div>'
  );
}

function previsaoMes(m, y, recAtual, crescFisio, pags, vendas, sessoes){
  const agora=new Date();
  const diffMeses=(y-agora.getFullYear())*12+(m-(agora.getMonth()+1));

  // Pilates: mantém estável (cresce muito devagar, ~0.5% ao mês)
  const pilates = Math.round(recAtual.pilates * (1 + diffMeses*0.005));

  // Fisio estúdio: cresce pelo crescimento médio mas com teto razoável
  // Limita crescimento a no máximo 20% acima do mês atual
  const crescimentoAplicado = Math.min(crescFisio, recAtual.fisioSist * 0.15);
  const fisioSist = Math.max(recAtual.fisioSist, Math.round(recAtual.fisioSist + crescimentoAplicado * diffMeses));
  const fisioSistComTeto = Math.min(fisioSist, recAtual.fisioSist * (1 + 0.2 * diffMeses));

  // Fisio domicílio Larissa: fixo (João + Elisangela)
  const fisioLarissa = LARISSA_FISIO_MENSAL;
  const fisio = fisioSistComTeto + fisioLarissa;

  // Loja: média dos últimos meses conhecidos
  const loja = Math.round(recAtual.loja);

  return{pilates, fisioSist:fisioSistComTeto, fisioLarissa, fisio, loja, total:pilates+fisio+loja};
}

async function confirmarDespesa(){
  const btn=document.getElementById('dp_btn'); btn.disabled=true; btn.textContent='Salvando…';
  const desc =document.getElementById('dp_desc').value.trim();
  const cat  =document.getElementById('dp_cat').value;
  const valor=parseFloat(document.getElementById('dp_valor').value)||0;
  const mes  =parseInt(document.getElementById('dp_mes').value);
  const ano  =parseInt(document.getElementById('dp_ano').value);
  if(!desc||!valor){ btn.disabled=false; btn.textContent='Salvar'; alert('Preencha descrição e valor.'); return; }
  try {
    await sbInsert('despesas',{descricao:desc,categoria:cat,valor,mes,ano,tipo:'variavel'});

}

async function rLogs(){
  set(

    '<span style="font-size:13px">Carregando histórico…</span></div>'
  );

  let rows = [];
  try {
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/logs_alteracoes?select=*&order=criado_em.desc&limit=2000`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}

function renderLogsView(rows){
  const hoje     = new Date(); hoje.setHours(0,0,0,0);
  const ontem    = new Date(hoje); ontem.setDate(hoje.getDate()-1);
  const semana   = new Date(hoje); semana.setDate(hoje.getDate()-7);

  function fmtDt(dt){
    if(!dt) return '—';
    const d = new Date(dt);
    const dHoje  = d.toDateString()===hoje.toDateString();
    const dOntem = d.toDateString()===ontem.toDateString();
    const hora   = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(dHoje)  return '<span style="color:var(--gold-dark);font-weight:500">Hoje '+hora+'</span>';
    if(dOntem) return '<span style="color:var(--brown-light)">Ontem '+hora+'</span>';

  function icone(tab, acao){
    if(tab==='pagamentos') return {i:'ti-cash',c:'#16a34a',bg:'rgba(22,163,74,.1)'};

    if(tab==='pacientes_fisio'||tab==='sessoes_fisio') return {i:'ti-heart-rate-monitor',c:'#4A6B2E',bg:'rgba(74,107,46,.1)'};
    if(tab==='sistema') return {i:'ti-login',c:'#888',bg:'rgba(128,128,128,.08)'};
    return {i:'ti-database',c:'#888',bg:'rgba(128,128,128,.08)'};
  }

  // Usuários únicos

    // ── CARDS RESUMO ──────────────────────────────────────

function renderLogRows(rows){
  function fmtDt(dt){
    if(!dt) return '—';
    const d = new Date(dt);
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ontem = new Date(hoje); ontem.setDate(hoje.getDate()-1);
    const hora = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    if(d.toDateString()===hoje.toDateString()) return '<span style="color:var(--gold-dark);font-weight:500">Hoje '+hora+'</span>';
    if(d.toDateString()===ontem.toDateString()) return 'Ontem '+hora;
    return d.toLocaleDateString('pt-BR')+' '+hora;
  }

  function iconeInfo(tab,acao){
    if(tab==='pagamentos') return {i:'ti-cash',c:'#16a34a',bg:'rgba(22,163,74,.1)',label:'Pagamento'};
    if(tab==='google_agenda') return {i:'ti-calendar-event',c:'#4285F4',bg:'rgba(66,133,244,.1)',label:'Agenda'};
    if(tab==='alunos') return {i:'ti-users',c:'#B8924A',bg:'rgba(184,146,74,.1)',label:'Aluno'};
    if(tab==='vendas') return {i:'ti-receipt',c:'#7A5230',bg:'rgba(122,82,48,.1)',label:'Venda'};
    if(tab==='estoque') return {i:'ti-package',c:'#6B7A2E',bg:'rgba(107,122,46,.1)',label:'Estoque'};
    if(tab==='encomendas') return {i:'ti-truck-delivery',c:'#8B6914',bg:'rgba(139,105,20,.1)',label:'Encomenda'};
    if(tab==='sessoes_fisio'||tab==='pacientes_fisio') return {i:'ti-heart-rate-monitor',c:'#4A6B2E',bg:'rgba(74,107,46,.1)',label:'Fisio'};
    if(tab==='sistema') return {i:'ti-login',c:'#888',bg:'rgba(128,128,128,.08)',label:'Sistema'};
    return {i:'ti-database',c:'#888',bg:'rgba(128,128,128,.08)',label:tab};
  }

  if(!rows.length) return '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--brown-light)">'+
    '<i class="ti ti-inbox" style="font-size:28px;opacity:.3;display:block;margin-bottom:8px"></i>Nenhum registro encontrado</td></tr>';

  return rows.map(r=>{
    const info = iconeInfo(r.tabela, r.acao);
    const isVitoria = r.perfil==='recepcao';
    const isPgto    = r.tabela==='pagamentos';
    const isAgenda  = r.tabela==='google_agenda';
    const rowStyle  = isPgto ? 'background:rgba(22,163,74,.04)' : isAgenda ? 'background:rgba(66,133,244,.04)' : '';

    return '<tr style="'+rowStyle+'">'+
    '<td style="font-size:12px;white-space:nowrap">'+fmtDt(r.criado_em)+'</td>'+
    '<td>'+
      '<div style="display:flex;align-items:center;gap:6px">'+
      '<div style="width:22px;height:22px;border-radius:50%;background:'+(isVitoria?'rgba(74,107,46,.2)':'rgba(184,146,74,.2)')+
      ';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:'+(isVitoria?'#3D5C3A':'#7A5230')+'">'+
      r.usuario.slice(0,2).toUpperCase()+'</div>'+
      '<span style="font-size:12px;font-weight:500;color:var(--brown)">'+r.usuario+'</span>'+
      '</div>'+
    '</td>'+
    '<td>'+
      '<div style="display:inline-flex;align-items:center;gap:5px;background:'+info.bg+';padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;color:'+info.c+'">'+
      '<i class="ti '+info.i+'" style="font-size:12px"></i>'+info.label+'</div>'+
    '</td>'+
    '<td style="font-size:12px;color:var(--brown)">'+r.acao+'</td>'+
    '<td style="font-size:12px;color:var(--brown-light);max-width:280px;overflow:hidden;text-overflow:ellipsis">'+(r.descricao||'—')+'</td>'+
    '</tr>';
  }).join('');
}

function filtrarLogs(){
  const ft      = (document.getElementById('logFt')?.value||'').toLowerCase();
  const usr     = document.getElementById('logUser')?.value||'';
  const tab     = document.getElementById('logTab')?.value||'';
  const periodo = document.getElementById('logPeriodo')?.value||'';
  const all     = window._logsCache||[];

  const hoje   = new Date(); hoje.setHours(0,0,0,0);
  const semana = new Date(hoje); semana.setDate(hoje.getDate()-7);
  const mes    = new Date(hoje); mes.setDate(1);

  const filtrado = all.filter(r=>{
    const dt = new Date(r.criado_em);
    const okFt  = !ft  || (r.descricao||'').toLowerCase().includes(ft) || (r.acao||'').toLowerCase().includes(ft) || (r.usuario||'').toLowerCase().includes(ft);
    const okUsr = !usr || r.usuario===usr;
    const okTab = !tab || r.tabela===tab;
    const okPer = !periodo ||
      (periodo==='hoje'  && dt>=hoje) ||
      (periodo==='semana'&& dt>=semana) ||
      (periodo==='mes'   && dt>=mes);
    return okFt && okUsr && okTab && okPer;
  });

  const body = document.getElementById('logBody');
  const cnt  = document.getElementById('logCount');
  if(body) body.innerHTML = renderLogRows(filtrado);
  if(cnt)  cnt.textContent = filtrado.length+' registros';
}

async function processarLote(codigo){
  codigo = (codigo||'').trim();
  if(!codigo) return;

  const lote = window._lote;

  // Efeito no box
  const box = document.getElementById('loteBox');
  if(box){ box.style.borderColor='var(--gold)'; }

  // Busca no banco
  try {
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/estoque?codigo_barras=eq.${encodeURIComponent(codigo)}&limit=1`,
      { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY} }
    );
    const lista = await r.json();

    if(lista[0]){
      // Reconhecido
      if(!lote.reconhecidos[codigo])
        lote.reconhecidos[codigo] = { peca: lista[0], count: 0 };
      lote.reconhecidos[codigo].count++;
    } else {
      // Não reconhecido
      if(!lote.desconhecidos[codigo])
        lote.desconhecidos[codigo] = { count: 0 };
      lote.desconhecidos[codigo].count++;
    }
  } catch(e){
    if(!lote.desconhecidos[codigo])
      lote.desconhecidos[codigo] = { count: 0 };
    lote.desconhecidos[codigo].count++;
  }

  // Adiciona à ordem (sem duplicar)
  if(!lote.ordem.includes(codigo)) lote.ordem.push(codigo);

  // Atualiza UI sem re-renderizar tudo
  atualizarResumoLote();
  const logEl = document.getElementById('loteLog');
  if(logEl) logEl.innerHTML = renderLoteLog();
  const input = document.getElementById('loteInput');
  if(input) input.focus();
}

function atualizarResumoLote(){
  const lote = window._lote;
  const totalItens = Object.values(lote.reconhecidos).reduce((s,v)=>s+v.count,0) +
                     Object.values(lote.desconhecidos).reduce((s,v)=>s+v.count,0);
  const totalRec  = Object.keys(lote.reconhecidos).length;
  const totalDesc = Object.keys(lote.desconhecidos).length;
  const totalRecQtd = Object.values(lote.reconhecidos).reduce((s,v)=>s+v.count,0);

  const elTotal = document.getElementById('loteTotal');
  const elRec   = document.getElementById('loteRec');
  const elRecQtd= document.getElementById('loteRecQtd');
  const elDesc  = document.getElementById('loteDesc');
  if(elTotal) elTotal.textContent = totalItens;
  if(elRec)   elRec.textContent   = totalRec;
  if(elRecQtd)elRecQtd.textContent= totalRecQtd+' unidades';
  if(elDesc)  elDesc.textContent  = totalDesc;
}

function ativarLoteBipagem(){
  ativarLeitorCodigoBarras(codigo=>{
    const input = document.getElementById('loteInput');
    if(input){ input.value = codigo; }
    processarLote(codigo);
  });
}

async function finalizarLote(){
  const lote = window._lote;
  const nDesc = Object.keys(lote.desconhecidos).length;
  const nRec  = Object.keys(lote.reconhecidos).length;

  if(nRec === 0 && nDesc === 0){ alert('Nenhuma peça bipada.'); return; }

  // Se tem não reconhecidos, abre modal para preencher
  if(nDesc > 0){
    abrirModalDesconhecidos();
  } else {
    // Tudo reconhecido — confirma direto
    await confirmarEntradaLote();
  }
}

function abrirModalDesconhecidos(){

  const marcas = ['Rosa Imperial','Camomila','Mnovo','Mantig','ALAD Amanda','Lm'];

    '<div class="mdt"><i class="ti ti-question-mark" style="margin-right:8px;color:#C0392B"></i>'+descs.length+' peça(s) não reconhecida(s)</div>'+
    '<p style="font-size:13px;color:var(--text-2);margin-bottom:16px">Preencha os dados das peças desconhecidas para cadastrá-las automaticamente no estoque.</p>'+

    descs.map(([codigo, d])=>
      `<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

          <span style="font-size:12px;color:var(--text-3)">×${d.count} unidades</span>
        </div>
        <input class="fi" data-codigo="${codigo}" data-campo="nome" placeholder="Nome da peça *" style="margin-bottom:8px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <select class="fi" data-codigo="${codigo}" data-campo="marca" style="margin-bottom:0">${marcaOpts}</select>
          <input class="fi" data-codigo="${codigo}" data-campo="tam" placeholder="Tamanho (P/M/G)" style="margin-bottom:0">
        </div>
      </div>`
    ).join('')+
    '</div>'+

    '<div class="mdf">'+
    '<button class="btn" onclick="fecharModal()">Cancelar</button>'+
    '<button class="btn" onclick="pularDesconhecidos()">Ignorar e entrar só os reconhecidos</button>'+
    '<button class="btn btnp" id="lote_btn" onclick="salvarDesconhecidosEFinalizar()"><i class="ti ti-check"></i> Cadastrar e finalizar</button>'+
    '</div>'
  );
}

async function pularDesconhecidos(){
  window._lote.desconhecidos = {};
  fecharModal();
  await confirmarEntradaLote();
}

async function salvarDesconhecidosEFinalizar(){
  const btn = document.getElementById('lote_btn');
  btn.disabled=true; btn.textContent='Salvando…';
  const lote = window._lote;

  // Lê os dados preenchidos
  document.querySelectorAll('[data-campo="nome"]').forEach(async el=>{
    const codigo = el.getAttribute('data-codigo');
    const nome   = el.value.trim();
    if(!nome) return; // ignora se não preencheu

    const marcaEl = document.querySelector(`[data-codigo="${codigo}"][data-campo="marca"]`);
    const tamEl   = document.querySelector(`[data-codigo="${codigo}"][data-campo="tam"]`);
    const marca   = marcaEl ? marcaEl.value||null : null;
    const tam     = tamEl   ? tamEl.value||null   : null;
    const qtd     = lote.desconhecidos[codigo]?.count||1;

    try {
      await sbInsert('estoque',{
        item:nome, marca, tamanho:tam,
        quantidade:qtd, codigo_barras:codigo
      });
      await registrarLog('cadastrou peça','estoque','Lote: '+nome+' ['+codigo+']');
      // Move para reconhecidos
      lote.reconhecidos[codigo] = { peca:{item:nome,marca,tamanho:tam,quantidade:0,codigo_barras:codigo}, count:qtd };
      delete lote.desconhecidos[codigo];
    } catch(e){ console.warn('Erro cadastro peça lote:', e.message); }
  });

  fecharModal();
  await confirmarEntradaLote();
}

async function confirmarEntradaLote(){
  const lote = window._lote;
  const recs  = Object.entries(lote.reconhecidos);
  if(!recs.length){ navLEstoque(); return; }

  // Mostra progresso
  set('<div class="pt">Entrada de Estoque</div>'+
  '<div class="ps">Atualizando estoque…</div>'+
  '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:14px">'+
  '<div style="width:32px;height:32px;border:3px solid var(--border-md);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div>'+
  '<div style="font-size:13px;color:var(--text-2)">Atualizando '+recs.length+' peça(s)…</div>'+
  '</div>');

  let ok=0, erro=0;
  for(const [codigo, {peca, count}] of recs){
    try {
      const novaQtd = (peca.quantidade||0) + count;
      await sbUpdate('estoque', peca.id, {quantidade: novaQtd});
      ok++;
    } catch(e){ erro++; }
  }

  const totalItens = recs.reduce((s,[,v])=>s+v.count,0);
  await registrarLog('entrada em lote','estoque', totalItens+' unidades · '+ok+' peças atualizadas');

  // Tela de conclusão
  set(
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:16px;text-align:center">'+
    '<div style="width:64px;height:64px;border-radius:50%;background:rgba(45,122,58,.1);display:flex;align-items:center;justify-content:center">'+
    '<i class="ti ti-circle-check" style="font-size:32px;color:#2D7A3A"></i></div>'+
    '<div class="pt" style="margin-bottom:0">Entrada concluída!</div>'+
    '<div class="ps" style="margin-bottom:0">'+totalItens+' unidades adicionadas ao estoque · '+ok+' peças atualizadas'+(erro>0?' · '+erro+' erro(s)':'')+'</div>'+

    // Resumo final
    '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 20px;width:100%;max-width:400px;margin-top:8px">'+
    recs.map(([cod,{peca,count}])=>
      `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px">
        <span style="color:var(--text-1);font-weight:500">${peca.item}</span>
        <span style="color:#2D7A3A;font-weight:700">+${count}</span>
      </div>`
    ).join('')+
    '</div>'+

    '<div style="display:flex;gap:10px;margin-top:8px">'+
    '<button class="btn" onclick="navLEntrada()"><i class="ti ti-barcode"></i> Nova entrada</button>'+
    '<button class="btn btnp" onclick="navLEstoque()"><i class="ti ti-package"></i> Ver estoque</button>'+
    '</div></div>'
  );
}

// BUSCA GLOBAL
function abrirBuscaGlobal(){
  abrirModal(
    '<div class="mdt"><i class="ti ti-search" style="margin-right:8px;color:var(--gold)"></i>Busca global</div>'+
    '<input class="fi" id="bg_query" placeholder="Nome do aluno, paciente ou peça…" oninput="renderBuscaGlobal(this.value)" style="margin-bottom:10px">'+
    '<div id="bg_result" style="max-height:360px;overflow-y:auto"><div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">Digite para buscar</div></div>'
  );
  setTimeout(()=>document.getElementById('bg_query')?.focus(),150);
}

function renderBuscaGlobal(q){
  const res=document.getElementById('bg_result'); if(!res) return;
  q=(q||'').toLowerCase().trim();
  if(q.length<2){ res.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">Digite pelo menos 2 caracteres</div>'; return; }
  const alunos   =(window._alunosDB||AL).filter(a=>a.n?.toLowerCase().includes(q));
  const pacientes=(window._fisioCache||FISIO).filter(p=>p.n?.toLowerCase().includes(q));
  const estoque  =(window._estoqueCache||[]).filter(e=>e.item?.toLowerCase().includes(q)||e.marca?.toLowerCase().includes(q));
  if(!alunos.length&&!pacientes.length&&!estoque.length){ res.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">Nenhum resultado</div>'; return; }
  let html='';
  if(alunos.length){
    html+='<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 4px 4px">Pilates</div>';
    html+=alunos.slice(0,5).map(a=>'<div onclick="fecharModal();verAlunoDetalhe(a)" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);cursor:pointer;background:var(--white)" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'var(--white)\'"><div class="av '+avcls(a.id||0)+'" style="width:32px;height:32px;font-size:11px">'+ini(a.n)+'</div><div><div style="font-size:13px;font-weight:500">'+a.n+'</div><div style="font-size:11px;color:var(--text-3)">'+sbadge(a.s)+' · '+(a.pl||'—')+'</div></div></div>').join('');
  }
  if(pacientes.length){
    html+='<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 4px 4px">Fisioterapia</div>';
    html+=pacientes.slice(0,5).map(p=>'<div onclick="fecharModal();verPacienteNome(\''+esc(p.n)+'\')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);cursor:pointer;background:var(--white)" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'var(--white)\'"><div style="width:32px;height:32px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--green)">'+ini(p.n)+'</div><div><div style="font-size:13px;font-weight:500">'+p.n+'</div><div style="font-size:11px;color:var(--text-3)">'+(p.realizadas||0)+'/'+(p.sessoes||'?')+' sessões</div></div></div>').join('');
  }
  if(estoque.length){
    html+='<div style="font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:8px 4px 4px">Estoque</div>';
    html+=estoque.slice(0,5).map(e=>'<div onclick="fecharModal();nav(\'l_estoque\')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);cursor:pointer;background:var(--white)" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'var(--white)\'"><div style="width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg-2);display:flex;align-items:center;justify-content:center"><i class="ti ti-shirt" style="color:var(--text-3)"></i></div><div><div style="font-size:13px;font-weight:500">'+e.item+'</div><div style="font-size:11px;color:var(--text-3)">'+(e.marca||'')+(e.preco?' · R$ '+e.preco:'')+'</div></div><span class="bdg '+(qtdN(e.qtd)===0?'br':'bg')+'" style="margin-left:auto">'+qtdN(e.qtd)+' un.</span></div>').join('');
  }
  res.innerHTML=html;
}
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();abrirBuscaGlobal();} });

// HISTÓRICO DE PAGAMENTOS POR ALUNO
async function verHistoricoPagamentos(nomeAluno){
  try {
    const r=await fetchWithTimeout(`${SB_URL}/rest/v1/pagamentos?aluno_nome=eq.${encodeURIComponent(nomeAluno)}&order=criado_em.desc&limit=50`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const pags=await r.json();
    if(!pags.length){alert('Nenhum pagamento registrado para '+nomeAluno);return;}
    abrirModal(
      '<div class="mdt"><i class="ti ti-cash" style="margin-right:8px;color:var(--gold)"></i>Histórico — '+nomeAluno+'</div>'+
      '<div class="tw"><table><thead><tr><th>Data</th><th>Referência</th><th>Valor</th><th>Forma</th></tr></thead><tbody>'+
      pags.map(p=>'<tr><td style="color:var(--text-2)">'+p.data_pgto+'</td><td style="color:var(--text-2)">'+p.referencia+'</td><td style="color:#2D7A3A;font-weight:600">'+fR(p.valor)+'</td><td style="color:var(--text-2)">'+p.forma_pgto+'</td></tr>').join('')+
      '<tr class="sum-row"><td colspan="2" style="text-align:right">Total</td><td style="color:#2D7A3A;font-weight:700">'+fR(pags.reduce((s,p)=>s+(parseFloat(p.valor)||0),0))+'</td><td></td></tr>'+
      '</tbody></table></div><div class="mdf"><button class="btn btnp" onclick="fecharModal()">Fechar</button></div>'
    );
  } catch(e){alert('Erro: '+e.message);}
}

// PRONTUÁRIO FISIOTERAPIA
async function verProntuario(nomePaciente){
  try {
    const r=await fetchWithTimeout(`${SB_URL}/rest/v1/sessoes_fisio?paciente_nome=eq.${encodeURIComponent(nomePaciente)}&order=data_sessao.asc`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    const sessoes=await r.json();
    abrirModal(
      '<div class="mdt"><i class="ti ti-clipboard-text" style="margin-right:8px;color:var(--gold)"></i>Prontuário — '+nomePaciente+'</div>'+
      (sessoes.length?
      '<div style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto">'+
      sessoes.map((s,i)=>{
        const iso=String(s.data_sessao||'').split('T')[0];const[y,m,d]=iso.split('-');
        const dt=iso?d+'/'+m+'/'+y.slice(2):'—';
        return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:12px">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
        '<span style="background:var(--green-light);color:var(--green);font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--r-full)">Sessão '+(i+1)+'</span>'+
        '<span style="font-size:12px;color:var(--text-2)">'+dt+'</span></div>'+
        (s.observacao?'<div style="font-size:12px;color:var(--text-1);line-height:1.5">'+s.observacao+'</div>':
        '<div style="font-size:12px;color:var(--text-3);font-style:italic">Sem observações</div>')+
        '</div>';
      }).join('')+'</div>'
      :'<div style="text-align:center;padding:24px;color:var(--text-3)">Nenhuma sessão registrada</div>')+
      '<div class="mdf"><button class="btn btnp" onclick="fecharModal()">Fechar</button></div>'
    );
  } catch(e){alert('Erro: '+e.message);}
}

function toggleMaisMobile(){
  const menu = document.getElementById('mobile_mais_menu');
  const btn  = document.getElementById('btn_mobile_mais');
  if(menu.classList.contains('open')){
    menu.classList.remove('open');
    btn.classList.remove('act');
  } else {
    menu.classList.add('open');
    btn.classList.add('act');
  }
}
function fecharMaisMobile(){
  document.getElementById('mobile_mais_menu')?.classList.remove('open');
  document.getElementById('btn_mobile_mais')?.classList.remove('act');
}

function set(h){document.getElementById('mn').innerHTML=h;}
function mc(lb,cor,vl,s2){return '<div class="mc"><div class="lb">'+lb+'</div><div class="vl '+cor+'">'+vl+'</div><div class="s2">'+s2+'</div></div>';}
function fs(n,cor,lb){return '<div class="fs"><div class="fn" style="color:'+cor+'">'+n+'</div><div class="fl">'+lb+'</div></div>';}
function dr(lb,val){return '<div class="dr"><span class="dl">'+lb+'</span><span>'+val+'</span></div>';}
function ncell(a){const id=a&&a.id?a.id:0;const n=a&&a.n?a.n:'?';return '<span style="display:flex;align-items:center"><span class="av '+avcls(id)+'">'+ini(n)+'</span>'+n+'</span>';}
function esc(s){return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
