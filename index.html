function buildGrade(){
  const g={};
  DIAS.forEach(d=>HORAS.forEach(h=>g[d+'-'+h]=[]));
  AL.filter(a=>a.s==='A').forEach(a=>{
    if(!a.h||a.h==='-'||a.h==='—') return;
    a.h.split(',').forEach(p=>{
      const m=p.trim().match(/^(SEG|TER|QUA|QUI|SEX|SAB)\s+(\d+H)/i);
      if(!m) return;
      const dm={SEG:'Seg',TER:'Ter',QUA:'Qua',QUI:'Qui',SEX:'Sex',SAB:'Sáb'};
      const k=dm[m[1].toUpperCase()]+'-'+m[2].toUpperCase();
      if(g[k]) g[k].push(a.n.split(' ').slice(0,2).map((w,i)=>i?w[0]+'.':w).join(' '));
    });
  });
  return g;
}

// Timeout helper — aborta se demorar mais de 6 segundos
function fetchWithTimeout(url, opts={}, ms=6000){
  const ctrl = new AbortController();
  const tid = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, {...opts, signal:ctrl.signal}).finally(()=>clearTimeout(tid));
}

async function sbGet(table, order='id'){
  const r = await fetchWithTimeout(`${SB_URL}/rest/v1/${table}?order=${order}`, {
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

const TIPO_PONTO = {
  entrada:      { label:'Entrada',       icon:'ti-login',       cor:'#2D7A3A' },
  inicio_pausa: { label:'Início pausa',  icon:'ti-coffee',      cor:'#C9A96E' },

  saida:        { label:'Saída',         icon:'ti-logout',      cor:'#C0392B' },
};
const CARGA_HORARIA = 6 * 60;

async function navPonto(){
  const isAdmin = usuarioAtual?.perfil==='admin';
  const usuario = usuarioAtual?.nome||'';

  // Inicializa mês selecionado
  if(!window._pontoMesSel && window._pontoMesSel!==0) window._pontoMesSel = new Date().getMonth();
  if(!window._pontoAnoSel) window._pontoAnoSel = new Date().getFullYear();

  set('<div class="pt">Controle de Ponto</div><div class="ps">Carga horária: 6h · Pausa: 15 min</div>'+
  '<div style="display:flex;align-items:center;justify-content:center;height:120px">'+
  '<div style="width:24px;height:24px;border:3px solid var(--border-md);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite"></div></div>');

  try {
    // Busca registros do mês selecionado (admin) ou mês atual (vitória)
    const mes = window._pontoMesSel;
    const ano = window._pontoAnoSel;
    const inicio = new Date(ano, mes, 1).toISOString();
    const fim    = new Date(ano, mes+1, 0, 23, 59, 59).toISOString();

    // Para vitória sempre busca mês atual; para admin busca o selecionado
    const inicioQuery = isAdmin ? inicio : new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();

    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/registros_ponto?select=*&horario=gte.${inicioQuery}&order=horario.desc&limit=500`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
    );
    renderPonto(await r.json().catch(()=>[]), isAdmin, usuario);
  } catch(e){ renderPonto([], isAdmin, usuario); }
}

function renderPonto(registros, isAdmin, usuarioLogado){
  const hoje = new Date();
  const hojeStr = hoje.toLocaleDateString('pt-BR');

  function fmtHora(iso){ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  function fmtMin(min){ const h=Math.floor(min/60),m=min%60; return h+'h'+(m>0?String(m).padStart(2,'0')+'min':''); }

  function calcMin(regs){
    const s=[...regs].sort((a,b)=>new Date(a.horario)-new Date(b.horario));
    const entrada = s.find(r=>r.tipo==='entrada');
    const saida   = s.find(r=>r.tipo==='saida');
    // Pausa é dentro da jornada — só conta saída - entrada (ou agora se em andamento)
    if(!entrada) return 0;
    const fim = saida ? new Date(saida.horario) : new Date();
    const totalMin = (fim - new Date(entrada.horario))/60000;
    return Math.max(0,Math.round(totalMin));
  }

  // Determina próximo tipo para o usuário logado
  const regHojeUser = registros.filter(r=>{
    const d=new Date(r.horario).toLocaleDateString('pt-BR');
    return d===hojeStr && r.usuario===usuarioLogado;
  }).sort((a,b)=>new Date(a.horario)-new Date(b.horario));

  const ultimoTipo = regHojeUser.length?regHojeUser[regHojeUser.length-1].tipo:null;
  const proximoTipo = !ultimoTipo?'entrada'
    :ultimoTipo==='entrada'?'inicio_pausa'
    :ultimoTipo==='inicio_pausa'?'fim_pausa'
    :ultimoTipo==='fim_pausa'?'saida':null;

  const minHoje = calcMin(regHojeUser);
  const pctHoje = Math.min(100,Math.round(minHoje/CARGA_HORARIA*100));

  if(isAdmin){
    // Inicializa mês selecionado
    if(!window._pontoMesSel) window._pontoMesSel = mesAtual;
    if(!window._pontoAnoSel) window._pontoAnoSel = anoAtual;
  }

  // ── Bloco de bater ponto ──────────────────────────────────
  let pontoHtml = '';
  if(!isAdmin){
    if(proximoTipo){
      const tp=TIPO_PONTO[proximoTipo];
      pontoHtml=
        '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;margin-bottom:20px;text-align:center;box-shadow:var(--shadow-sm)">'+
        '<div style="font-size:13px;color:var(--text-3);margin-bottom:16px">'+hojeStr+' · '+hoje.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div>'+
        '<div style="margin-bottom:20px">'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px">'+
        '<span>Horas trabalhadas hoje</span><span style="font-weight:600">'+fmtMin(minHoje)+' / 6h</span></div>'+
        '<div style="height:8px;border-radius:4px;background:var(--bg-2)">'+
        '<div style="width:'+pctHoje+'%;height:100%;border-radius:4px;background:'+(pctHoje>=100?'#2D7A3A':'var(--gold)')+'"></div></div>'+
        (minHoje>0&&pctHoje<100?'<div style="font-size:11px;color:var(--text-3);margin-top:4px">Faltam '+fmtMin(CARGA_HORARIA-minHoje)+'</div>':'')+
        '</div>'+
        '<button onclick="registrarPonto(\''+proximoTipo+'\')" style="background:'+tp.cor+';color:#fff;border:none;border-radius:var(--r-full);padding:16px 40px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 20px rgba(0,0,0,.15);display:inline-flex;align-items:center;gap:10px">'+
        '<i class="ti '+tp.icon+'" style="font-size:20px"></i> '+tp.label+'</button>'+
        (regHojeUser.length?
          '<div style="margin-top:20px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap">'+
          regHojeUser.map(r=>{const tp2=TIPO_PONTO[r.tipo]||{};return(
            '<div style="text-align:center">'+
            '<div style="font-size:10px;color:var(--text-3);font-weight:600;text-transform:uppercase">'+tp2.label+'</div>'+
            '<div style="font-size:15px;font-weight:700;color:'+(tp2.cor||'var(--text-1)')+'">'+fmtHora(r.horario)+'</div></div>'
          );}).join('<div style="color:var(--border-md);font-size:18px;margin-top:10px">→</div>')+
          '</div>':'')+'</div>';
    } else {
      pontoHtml='<div style="background:#E8F5EC;border:1px solid #B8DFC0;border-radius:var(--r-xl);padding:28px;margin-bottom:20px;text-align:center">'+
      '<i class="ti ti-circle-check" style="font-size:36px;color:#2D7A3A;display:block;margin-bottom:8px"></i>'+
      '<div style="font-size:16px;font-weight:700;color:#2D7A3A">Dia concluído!</div>'+
      '<div style="font-size:13px;color:#3D7A4A;margin-top:4px">Total: <strong>'+fmtMin(minHoje)+'</strong></div></div>';
    }
  } else {
    pontoHtml='<div style="display:flex;gap:10px;margin-bottom:20px">'+
    '<button class="btn btnb" onclick="abrirRegistroPontoAdmin()"><i class="ti ti-clock-plus"></i> Registrar ponto retroativo</button>'+
    '</div>';
  }

  // ── Histórico por dia ─────────────────────────────────────
  const regsVisiveis = isAdmin ? registros : registros.filter(r=>r.usuario===usuarioLogado);
  const porDia={};
  regsVisiveis.forEach(r=>{
    const d=new Date(r.horario).toLocaleDateString('pt-BR');
    if(!porDia[d]) porDia[d]=[];
    porDia[d].push(r);
  });
  const dias=Object.entries(porDia).sort((a,b)=>new Date(b[0].split('/').reverse().join('-'))-new Date(a[0].split('/').reverse().join('-')));

  const histHtml=dias.slice(0,20).map(([dia,regs])=>{
    const regsDia=regs.sort((a,b)=>new Date(a.horario)-new Date(b.horario));
    const min=calcMin(regsDia);
    const completo=!!regsDia.find(r=>r.tipo==='saida');
    const diaHoje=dia===hojeStr;
    return '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-xs)">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
    '<div style="font-size:13px;font-weight:700;color:var(--text-1)">'+dia+(diaHoje?' <span class="bdg ba">hoje</span>':'')+'</div>'+
    '<div style="margin-left:auto;display:flex;align-items:center;gap:8px">'+
    '<span style="font-size:13px;font-weight:600;color:'+(completo?'#2D7A3A':'var(--gold-dark)')+'">'+fmtMin(min)+'</span>'+
    '<span class="bdg '+(completo?'bg':'ba')+'">'+(completo?'Completo':'Em andamento')+'</span>'+
    (isAdmin?'<button class="btn btns" onclick="abrirRegistroPontoAdmin(\''+dia+'\')"><i class="ti ti-plus"></i></button>':'')+
    '</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    regsDia.map(r=>{
      const tp2=TIPO_PONTO[r.tipo]||{label:r.tipo,cor:'var(--text-2)',icon:'ti-clock'};
      return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 12px;display:flex;align-items:center;gap:8px">'+

  }).join('');

  set(
    '<div class="pt">Controle de Ponto</div>'+
    '<div class="ps">Carga horária: 6h · Pausa: 15 min · '+hojeStr+'</div>'+
    pontoHtml+
    '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">'+
    (isAdmin?'Histórico — todos':'Meu histórico')+'</div>'+
    (isAdmin ? consolidadoPontoMes(registros) : '')+
    (histHtml||'<div style="text-align:center;padding:32px;color:var(--text-3)">Nenhum registro ainda</div>')
  );
}

async function confirmarPontoAdmin(){

function consolidadoPontoMes(registros){
  const nomesMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mes = window._pontoMesSel ?? new Date().getMonth();
  const ano = window._pontoAnoSel ?? new Date().getFullYear();

  function mesPrev(){
    if(window._pontoMesSel===0){ window._pontoMesSel=11; window._pontoAnoSel--; }
    else window._pontoMesSel--;
    navPonto();
  }
  function mesNext(){
    const agora=new Date();
    if(window._pontoAnoSel===agora.getFullYear()&&window._pontoMesSel===agora.getMonth()) return;
    if(window._pontoMesSel===11){ window._pontoMesSel=0; window._pontoAnoSel++; }
    else window._pontoMesSel++;
    navPonto();
  }
  window._mesPrev = mesPrev;
  window._mesNext = mesNext;

  const agora   = new Date();
  const isAtual = mes===agora.getMonth() && ano===agora.getFullYear();

  function fmtHora(iso){ return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  function fmtMin(min){
    if(!min||min<=0) return '—';
    const h=Math.floor(min/60), m=min%60;
    return h+'h'+(m>0?String(m).padStart(2,'0'):'')+'min';
  }
  function fmtSaldo(min){
    const abs=Math.abs(min);
    const h=Math.floor(abs/60), m=abs%60;
    const s=h+'h'+(m>0?String(m).padStart(2,'0'):'')+'min';
    return min>=0?'+'+s:'-'+s;
  }

  // Calcula todos os dias úteis do mês (seg-sex) até hoje se mês atual
  function getDiasUteis(){
    const dias=[];
    const limite = isAtual ? agora : new Date(ano, mes+1, 0); // último dia do mês
    const d = new Date(ano, mes, 1);
    while(d.getMonth()===mes && d<=limite){
      const dow=d.getDay();
      if(dow>=1&&dow<=5) dias.push(d.toLocaleDateString('pt-BR'));
      d.setDate(d.getDate()+1);
    }
    return dias;
  }

  const diasUteis = getDiasUteis();

  // Filtra registros da Vitória no mês/ano selecionado
  const regVit = registros.filter(r=>{
    const d=new Date(r.horario);
    return r.usuario==='Vitória' && d.getMonth()===mes && d.getFullYear()===ano;
  });

  // Agrupa por dia
  const porDia={};
  regVit.forEach(r=>{
    const d=new Date(r.horario).toLocaleDateString('pt-BR');
    if(!porDia[d]) porDia[d]=[];
    porDia[d].push(r);
  });

  // Dias que trabalhou = tem entrada E saída registradas
  const diasTrabalhados = Object.keys(porDia).filter(d=>{
    const regs = porDia[d];
    return regs.some(r=>r.tipo==='entrada') && regs.some(r=>r.tipo==='saida');
  });
  // Faltas = dias úteis sem registro completo (sem entrada+saída)
  const faltas = diasUteis.filter(d=>!diasTrabalhados.includes(d));

  const CARGA_DIA=6*60;

  function calcMinDia(regs){
    const s=[...regs].sort((a,b)=>new Date(a.horario)-new Date(b.horario));
    const entrada = s.find(r=>r.tipo==='entrada');
    const saida   = s.find(r=>r.tipo==='saida');
    // Pausa é dentro da jornada — só conta saída - entrada
    if(!entrada||!saida) return 0;
    return Math.max(0, Math.round((new Date(saida.horario)-new Date(entrada.horario))/60000));
  }

  const totalMinTrab = Object.values(porDia).reduce((s,regs)=>s+calcMinDia(regs),0);
  // Total esperado = dias úteis × 6h (faltas contam como débito)
  const totalEsperado = diasUteis.length * CARGA_DIA;
  // Saldo = horas trabalhadas - horas esperadas (faltas já entram como -6h cada)
  const saldo = totalMinTrab - totalEsperado;

  // Monta lista unificada: dias trabalhados + faltas, ordenada por data
  const todasLinhas = [
    ...diasUteis.map(dia=>({
      dia,
      tipo: porDia[dia]
        ? (porDia[dia].some(r=>r.tipo==='entrada') && porDia[dia].some(r=>r.tipo==='saida')
            ? 'trabalhou'
            : 'incompleto') // tem registro mas sem saída
        : 'falta',
      regs: porDia[dia]||[]
    }))
  ];

  return '<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:20px;box-shadow:var(--shadow-xs)">'+

  // Header com navegação
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'+
  '<button class="btn btns" onclick="window._mesPrev()"><i class="ti ti-chevron-left"></i></button>'+
  '<div style="flex:1">'+
  '<div style="font-size:16px;font-weight:700;color:var(--text-1)">Fechamento — Vitória</div>'+
  '<div style="font-size:13px;color:var(--gold-dark);font-weight:600">'+nomesMes[mes]+' '+ano+(isAtual?' <span style="font-size:10px;color:var(--text-3)">(atual · até hoje)</span>':'')+'</div>'+
  '</div>'+
  '<button class="btn btns" onclick="window._mesNext()" '+(isAtual?'disabled style="opacity:.3"':'')+'>'+
  '<i class="ti ti-chevron-right"></i></button>'+
  '</div>'+

  // Cards resumo
  '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px">'+
  '<div style="text-align:center;background:var(--bg);border-radius:var(--r-md);padding:10px 8px">'+
  '<div style="font-size:9px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Dias úteis</div>'+
  '<div style="font-size:22px;font-weight:700;color:var(--text-1)">'+diasUteis.length+'</div>'+
  '</div>'+
  '<div style="text-align:center;background:rgba(45,122,58,.07);border-radius:var(--r-md);padding:10px 8px">'+
  '<div style="font-size:9px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Trabalhou</div>'+
  '<div style="font-size:22px;font-weight:700;color:#2D7A3A">'+diasTrabalhados.length+'</div>'+
  '</div>'+
  '<div style="text-align:center;background:'+(faltas.length?'rgba(192,57,43,.07)':'rgba(45,122,58,.07)')+';border-radius:var(--r-md);padding:10px 8px">'+
  '<div style="font-size:9px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Faltas</div>'+
  '<div style="font-size:22px;font-weight:700;color:'+(faltas.length?'#C0392B':'#2D7A3A')+'">'+faltas.length+'</div>'+
  '</div>'+
  '<div style="text-align:center;background:var(--bg);border-radius:var(--r-md);padding:10px 8px">'+
  '<div style="font-size:9px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Horas</div>'+
  '<div style="font-size:22px;font-weight:700;color:var(--gold-dark)">'+fmtMin(totalMinTrab)+'</div>'+
  '</div>'+
  '<div style="text-align:center;background:'+(saldo>=0?'rgba(45,122,58,.07)':'rgba(192,57,43,.07)')+';border-radius:var(--r-md);padding:10px 8px">'+
  '<div style="font-size:9px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">Saldo</div>'+
  '<div style="font-size:22px;font-weight:700;color:'+(saldo>=0?'#2D7A3A':'#C0392B')+'">'+fmtSaldo(saldo)+'</div>'+
  '</div>'+
  '</div>'+

  // Tabela unificada
  '<div class="tw"><table><thead><tr>'+
  '<th>Data</th><th>Entrada</th><th>Pausa</th><th>Volta</th><th>Saída</th><th>Total</th><th>Saldo dia</th><th></th>'+
  '</tr></thead><tbody>'+
  todasLinhas.map(({dia,tipo,regs})=>{
    if(tipo==='falta'){
      return '<tr style="background:rgba(192,57,43,.04)">'+
      '<td style="font-weight:600;color:#C0392B">'+dia+' <span class="bdg br" style="font-size:9px">falta</span></td>'+
      '<td colspan="4" style="color:var(--text-3);font-size:12px;font-style:italic">Sem registro</td>'+
      '<td style="font-weight:700;color:#C0392B">—</td>'+
      '<td style="font-weight:700;color:#C0392B">-6h</td>'+
      '<td><button class="btn btns" onclick="abrirRegistroPontoAdmin(\''+dia+'\')"><i class="ti ti-plus"></i></button></td>'+
      '</tr>';
    }
    if(tipo==='incompleto'){
      const sorted=[...regs].sort((a,b)=>new Date(a.horario)-new Date(b.horario));
      const get=t=>sorted.find(r=>r.tipo===t);
      const entrada=get('entrada');
      function cel(r){ return r?'<span style="font-weight:600">'+(r.horario_manual?'<i class="ti ti-pencil" style="font-size:9px;color:var(--gold);margin-right:2px"></i>':'')+fmtHora(r.horario)+'</span>':'<span style="color:var(--text-3)">—</span>'; }
      return '<tr style="background:rgba(201,169,110,.06)">'+
      '<td style="font-weight:600;color:var(--gold-dark)">'+dia+' <span class="bdg ba" style="font-size:9px">incompleto</span></td>'+
      '<td>'+cel(entrada)+'</td>'+
      '<td colspan="3" style="color:var(--text-3);font-size:12px">Sem saída registrada</td>'+
      '<td style="color:var(--text-3)">—</td>'+
      '<td style="color:var(--text-3)">—</td>'+
      '<td><button class="btn btns" onclick="abrirRegistroPontoAdmin(\''+dia+'\')"><i class="ti ti-plus"></i></button></td>'+
      '</tr>';
    }
    const sorted=[...regs].sort((a,b)=>new Date(a.horario)-new Date(b.horario));
    const get=t=>sorted.find(r=>r.tipo===t);
    const entrada=get('entrada'),iniP=get('inicio_pausa'),fimP=get('fim_pausa'),saida=get('saida');
    const minDia=calcMinDia(regs), saldoDia=minDia-CARGA_DIA;
    const completo=!!saida, temManual=regs.some(r=>r.horario_manual);
    function cel(r){ return r?'<span style="font-weight:600">'+(r.horario_manual?'<i class="ti ti-pencil" style="font-size:9px;color:var(--gold);margin-right:2px"></i>':'')+fmtHora(r.horario)+'</span>':'<span style="color:var(--text-3)">—</span>'; }
    return '<tr>'+
    '<td style="font-weight:600">'+dia+(temManual?' <span style="font-size:9px;color:var(--gold-dark)">●</span>':'')+'</td>'+
    '<td>'+cel(entrada)+'</td><td>'+cel(iniP)+'</td><td>'+cel(fimP)+'</td><td>'+cel(saida)+'</td>'+
    '<td style="font-weight:600;color:'+(minDia>0?'var(--gold-dark)':'var(--text-3)')+'">'+fmtMin(minDia)+'</td>'+
    '<td><span style="font-size:12px;font-weight:600;color:'+(completo?(saldoDia>=0?'#2D7A3A':'#C0392B'):'var(--text-3)')+'">'+(completo?fmtSaldo(saldoDia):'—')+'</span></td>'+
    '<td><button class="btn btns" onclick="abrirRegistroPontoAdmin(\''+dia+'\')"><i class="ti ti-plus"></i></button></td>'+
    '</tr>';
  }).join('')+
  '<tr class="sum-row"><td colspan="5" style="text-align:right">Total ('+diasUteis.length+' dias úteis)</td>'+
  '<td style="font-weight:700;color:var(--gold-dark)">'+fmtMin(totalMinTrab)+'</td>'+
  '<td style="font-weight:700;color:'+(saldo>=0?'#2D7A3A':'#C0392B')+'">'+fmtSaldo(saldo)+'</td><td></td></tr>'+
  '</tbody></table></div>'+
  '<div style="font-size:11px;color:var(--text-3);margin-top:8px">'+
  '<i class="ti ti-info-circle"></i> Seg–Sex · 6h/dia · faltas = -6h no saldo'+
  ' · <i class="ti ti-pencil" style="color:var(--gold)"></i> = manual</div>'+
  '</div>';
}

async function navPAlunos(){
  try {
    window._alunosDB = AL;
    renderPAlunos();
    const rows = await sbGet('alunos','nome');
    // Nomes que o banco conhece (incluindo excluídos)
    const dbNomes = new Set(rows.map(r=>r.nome.trim().toLowerCase()));
    // Excluídos no banco — não devem aparecer
    const excluidos = new Set(rows.filter(r=>r.status==='excluido').map(r=>r.nome.trim().toLowerCase()));
    const dbMapped = rows
      .filter(r=>r.status!=='excluido')
      .map(r=>({
        id:r.id, s:r.status, n:r.nome, tel:r.telefone,
        pl:r.plano, h:r.horario||'—', v:parseFloat(r.valor)||0,
        pg:r.ultimo_pagto, px:r.prox_vencto
      }));
    // Locais: só os que o banco não conhece E não foram excluídos
    const localExtras = AL.filter(a=>
      !dbNomes.has(a.n.trim().toLowerCase()) &&
      !excluidos.has(a.n.trim().toLowerCase())
    );
    window._alunosDB = rows.length > 0
      ? [...dbMapped, ...localExtras]
      : AL.filter(a=>!excluidos.has(a.n.trim().toLowerCase()));
    renderPAlunos();
  } catch(e){
    console.warn('navPAlunos:', e.message);
    window._alunosDB = AL;
    renderPAlunos();
  }
}

// Helpers vencimento
function vencido(px){
  if(!px||px==='parceria') return false;
  const p=px.split('/'); if(p.length<3) return false;
  const d=new Date('20'+p[2]+'-'+p[1]+'-'+p[0]); d.setHours(23,59,59);
  return d < new Date();
}
function proxVencer(px){
  if(!px||px==='parceria') return false;
  const p=px.split('/'); if(p.length<3) return false;
  const d=new Date('20'+p[2]+'-'+p[1]+'-'+p[0]);
  const diff=(d-new Date())/(1000*60*60*24);
  return diff>=0 && diff<=5;
}

async function salvarEdicaoAluno(){
  const a   = window._alunoAtual;
  if(!a) return;
  const btn = document.getElementById('ea_btn');
  btn.disabled=true; btn.textContent='Salvando…';

  const dados = {
    nome:            document.getElementById('ea_nome').value.trim(),
    telefone:        document.getElementById('ea_tel').value.trim()||null,
    data_nascimento: document.getElementById('ea_nasc').value||null,
    status:          document.getElementById('ea_status').value,
    valor:           parseFloat(document.getElementById('ea_val').value)||0,
    plano:           document.getElementById('ea_plano').value,
    horario:         document.getElementById('ea_h').value.trim()||null,
    ultimo_pagto:    document.getElementById('ea_pg').value.trim()||null,
    prox_vencto:     document.getElementById('ea_px').value.trim()||null,
  };

  try {
    // Garante no banco e atualiza
    await garantirAlunoBanco(a);
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/alunos?nome=eq.${encodeURIComponent(a.n)}&limit=1`,
      { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY} }
    );
    const lista = await r.json();
    if(lista[0]) await sbUpdate('alunos', lista[0].id, dados);

    // Atualiza cache local
    Object.assign(a, {
      n:a.n, tel:dados.telefone, s:dados.status,
      v:dados.valor, pl:dados.plano, h:dados.horario,
      pg:dados.ultimo_pagto, px:dados.prox_vencto
    });
    // Atualiza nome se mudou
    if(dados.nome !== a.n){
      a.n = dados.nome;
    }
    atualizarCacheAluno(a.n, a);

    await registrarLog('editou aluno','alunos', dados.nome);
    fecharModal();
    verAlunoDetalhe(a);
  } catch(e){ btn.disabled=false; btn.textContent='Salvar'; alert('Erro: '+e.message); }
}

async function pausarAluno(){
  const a = window._alunoAtual;
  if(!a) return;

  // Se Google conectado, busca eventos futuros com o nome do aluno
  let eventosFuturos = [];
  const primeiroNome = a.n.split(' ')[0].toLowerCase();

  if(gcalToken){
    try {
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const fim  = new Date(hoje); fim.setMonth(fim.getMonth()+3);
      // Busca em todos os calendários visíveis
      const promises = gcalCals.filter(c=>c.selected!==false).map(c=>
        gcalListEvents(c.id, hoje.toISOString(), fim.toISOString())
          .then(evs=>evs.map(e=>({...e,_calId:c.id,_calNome:c.summary})))
          .catch(()=>[])
      );
      const todos = (await Promise.all(promises)).flat();
      // Filtra eventos que contêm o primeiro nome do aluno (case insensitive)
      eventosFuturos = todos.filter(e=>(e.summary||'').toLowerCase().includes(primeiroNome));
    } catch(err){ console.warn('Busca agenda:', err.message); }
  }

  // Monta o modal com aviso + eventos encontrados
  const temEventos = eventosFuturos.length > 0;

  function fmtEvento(ev){
    const s = ev.start?.dateTime||ev.start?.date||'';
    const d = s ? new Date(s) : null;
    const dataStr = d ? d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})+
      (ev.start?.dateTime?' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'') : '—';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500;color:var(--brown)">${ev.summary}</div>
        <div style="font-size:11px;color:var(--brown-light)">${dataStr} · ${ev._calNome}</div>
      </div>
      <a href="https://calendar.google.com/calendar/r/eventedit/${ev.id}" target="_blank"
        style="font-size:11px;color:#4285F4;text-decoration:none;white-space:nowrap">
        <i class="ti ti-external-link"></i> Editar
      </a>
    </div>`;
  }

  abrirModal(
    '<div class="mdt"><i class="ti ti-pause-circle" style="color:var(--gold-dark);margin-right:8px"></i>Pausar aluno — '+a.n.split(' ')[0]+'</div>'+

    '<div style="background:rgba(184,146,74,.08);border:1px solid rgba(184,146,74,.25);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--brown)">'+
    '<strong>'+a.n+'</strong> será marcado como pausado e sairá dos financeiros e métricas do sistema.</div>'+

    '<label class="fl">Motivo da pausa (opcional)</label>'+
    '<input class="fi" id="pause_motivo" placeholder="Ex: Viagem, problema de saúde, férias…">'+

    (temEventos?

  btn.disabled=true; btn.textContent='Pausando…';
  try {

function atualizarCacheAluno(nome, dados){
  [AL, window._alunosDB||[]].forEach(lista=>{

// Garante que o aluno existe no banco (insere se necessário)
async function garantirAlunoBanco(a){
  const r = await fetchWithTimeout(
    `${SB_URL}/rest/v1/alunos?nome=eq.${encodeURIComponent(a.n)}&limit=1`,
    { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY} }
  );
  const lista = await r.json();
  if(!lista[0]){
    await sbInsert('alunos',{
      status:a.s||'A', nome:a.n, telefone:a.tel||null,
      plano:a.pl||null, horario:a.h||null, valor:parseFloat(a.v)||0,
      ultimo_pagto:a.pg||null, prox_vencto:a.px||null,
    });
  }
}

async function excluirAluno(){
  const a = window._alunoAtual;
  if(!a) return;
  if(!confirm('Excluir o cadastro de '+a.n+'?\n\nEsta ação não pode ser desfeita.')) return;
  try {
    // Busca no banco pelo nome
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/alunos?nome=eq.${encodeURIComponent(a.n)}&limit=1`,
      { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY} }
    );
    const lista = await r.json();

    if(lista[0]){
      // Já está no banco — exclui
      await sbDelete('alunos', lista[0].id);
    } else {
      // Só existe no hardcode — insere com status 'excluido' para marcar
      // Assim o banco "sabe" que foi excluído e não volta pelo merge
      await sbInsert('alunos',{
        nome: a.n, status: 'excluido',
        telefone: a.tel||null, plano: a.pl||null,
        horario: a.h||null, valor: parseFloat(a.v)||0,
        ultimo_pagto: a.pg||null, prox_vencto: a.px||null,
      });
    }

    // Remove de todos os caches locais
    const remover = (arr) => {
      const i = arr.findIndex(x=>x.n===a.n);
      if(i>=0) arr.splice(i,1);
    };
    remover(AL);
    if(window._alunosDB) remover(window._alunosDB);

    await registrarLog('excluiu aluno','alunos', a.n);
    navPAlunos();
  } catch(e){ alert('Erro ao excluir: '+e.message); }
}

async function converterAtivoObj(){

}

function renderPFin(at, pags){
  const permF = usuarioAtual ? (PERMISSOES[usuarioAtual.perfil]||PERMISSOES.recepcao) : PERMISSOES.admin;
  const rec   = at.reduce((s,a)=>s+(parseFloat(a.v)||0),0);
  const sd    = at.filter(a=>!a.px||a.px==='parceria').length;

  const agora    = new Date(); agora.setHours(0,0,0,0);
  const mesAtual = agora.getMonth()+1;
  const anoAtual = agora.getFullYear();
  const mesStr   = String(mesAtual).padStart(2,'0');
  const anoStr   = String(anoAtual).slice(2);

  // Converte prox_vencto — aceita dd/mm/aa E dd/mm/yyyy
  function parseData(s){
    if(!s||s==='parceria') return null;
    const p=s.split('/');
    if(p.length<3) return null;
    const d=parseInt(p[0]), m=parseInt(p[1]);
    // Ano: 2 dígitos (26 → 2026) ou 4 dígitos (2026)
    const a = p[2].length===4 ? parseInt(p[2]) : parseInt('20'+p[2]);
    if(isNaN(d)||isNaN(m)||isNaN(a)) return null;
    return new Date(a, m-1, d);
  }

  // Pendente = próx vencimento <= hoje (já venceu ou vence hoje)
  // Pago/em dia = próx vencimento > hoje (ainda não chegou a hora de pagar)
  function isPendente(a){
    // Sem data: sempre pendente
    if(!a.px||a.px==='parceria') return true;
    const d = parseData(a.px);
    if(!d) return true;
    // Se vencimento é hoje ou já passou → pendente
    return d <= agora;
  }

  const pendentes   = at.filter(a=>isPendente(a));
  const emDia       = at.filter(a=>!isPendente(a));

  // Ordena pendentes: mais atrasados primeiro
  const pendOrdenados = [...pendentes].sort((a,b)=>{
    const da=parseData(a.px), db=parseData(b.px);
    if(!da) return 1; if(!db) return -1;
    return da-db;
  });

  // Ordena em dia: próximos a vencer primeiro
  const emDiaOrdenados = [...emDia].sort((a,b)=>{
    const da=parseData(a.px), db=parseData(b.px);
    if(!da) return 1; if(!db) return -1;
    return da-db;
  });

  function diasAtraso(px){
    const d=parseData(px); if(!d) return 0;
    return Math.floor((agora-d)/(1000*60*60*24));
  }

  function diasAteVencer(px){
    const d=parseData(px); if(!d) return 999;
    return Math.floor((d-agora)/(1000*60*60*24));
  }

  // Separa em 3 grupos:
  // 1. Vencidos (px existe e já passou)
  // 2. Sem data (px e pg ambos vazios → parceria)
  // 3. Em dia (px existe e ainda não passou)
  const vencidos2   = pendentes.filter(a=>a.px&&a.px!=='parceria');
  const semDadosPag = pendentes.filter(a=>(!a.px||a.px==='parceria')&&!a.pg);
  const semVencSoPg = pendentes.filter(a=>(!a.px||a.px==='parceria')&&a.pg); // pagou mas sem próx data

  set(
    '<div class="pt">Financeiro — Pilates</div>'+
    '<div class="ps">Controle de mensalidades · '+mesAtual+'/'+anoAtual+'</div>'+

    '<div class="metrics3">'+
    (permF.verFinGeral ? mc('Receita estimada/mês','vg','R$ '+rec.toLocaleString('pt-BR'),at.length+' ativos') : '')+
    mc('Em dia','vg',emDia.length,'de '+at.length+' ativos')+
    mc('Pendentes','vr',pendentes.length, semDadosPag.length>0?semDadosPag.length+' parcerias':'')+
    '</div>'+

    '<div class="tb"><button class="btn btnb" onclick="abrirPagPilates(null,null)">'+
    '<i class="ti ti-plus"></i> Registrar pagamento</button></div>'+

    // ── 1. VENCIDOS ───────────────────────────────────────────
    (vencidos2.length?
    '<div style="font-size:11px;font-weight:600;color:#C0392B;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+
    '<i class="ti ti-alert-circle"></i> Vencidos ('+vencidos2.length+')</div>'+
    '<div class="tw" style="margin-bottom:18px"><table><thead><tr>'+
    '<th>Aluno</th><th>Plano</th><th>Venceu em</th><th>Atraso</th><th>Valor</th><th></th>'+
    '</tr></thead><tbody>'+
    [...vencidos2].sort((a,b)=>{
      const da=parseData(a.px),db=parseData(b.px);
      if(!da) return 1; if(!db) return -1; return da-db;
    }).map(a=>{
      const atraso=diasAtraso(a.px);
      return '<tr>'+
      '<td>'+ncell(a)+'</td>'+
      '<td style="color:var(--text-2);font-size:12px">'+a.pl+'</td>'+
      '<td><span style="color:#C0392B;font-weight:600">'+a.px+'</span></td>'+
      '<td><span class="bdg br">'+atraso+'d</span></td>'+
      '<td style="font-weight:500">R$ '+a.v+'</td>'+
      '<td><button class="btn btns btnb" onclick="abrirPagPilates(\''+esc(a.n)+'\','+(a.v||0)+')">✓</button></td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>':'') +

    // ── 2. PRÓXIMOS A VENCER ─────────────────────────────────
    (emDia.length?
    '<div style="font-size:11px;font-weight:600;color:#2D7A3A;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+
    '<i class="ti ti-calendar-time"></i> Próximos vencimentos ('+emDia.length+')</div>'+
    '<div class="tw" style="margin-bottom:18px"><table><thead><tr>'+
    '<th>Aluno</th><th>Plano</th><th>Próx. venc.</th><th>Faltam</th><th>Valor</th>'+
    '</tr></thead><tbody>'+
    emDiaOrdenados.map(a=>{
      const dias=diasAteVencer(a.px);
      const urgente=dias<=5;
      return '<tr>'+
      '<td>'+ncell(a)+'</td>'+
      '<td style="color:var(--text-2);font-size:12px">'+a.pl+'</td>'+
      '<td><span style="color:'+(urgente?'var(--gold-dark)':'#2D7A3A')+';font-weight:600">'+a.px+'</span></td>'+
      '<td><span class="bdg '+(urgente?'ba':'bg')+'">'+dias+'d</span></td>'+
      '<td style="color:var(--text-2)">R$ '+a.v+'</td>'+
      '</tr>';
    }).join('')+'</tbody></table></div>':'') +

    // ── 3. PARCERIAS (sem pgto e sem vencimento) ──────────────
    (semDadosPag.length?
    '<div style="font-size:11px;font-weight:600;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+
    '<i class="ti ti-handshake"></i> Parcerias / sem controle de pagamento ('+semDadosPag.length+')</div>'+

    semDadosPag.map(a=>

    '</tr></thead><tbody>'+
    semVencSoPg.map(a=>
      '<tr>'+
      '<td>'+ncell(a)+'</td>'+
      '<td style="color:var(--text-2);font-size:12px">'+a.pl+'</td>'+
      '<td style="color:var(--text-2)">'+a.pg+'</td>'+
      '<td style="color:var(--text-2)">R$ '+a.v+'</td>'+
      '<td><button class="btn btns btnb" onclick="abrirPagPilates(\''+esc(a.n)+'\','+(a.v||0)+')">✓</button></td>'+

    // ── 5. ÚLTIMOS PAGAMENTOS ─────────────────────────────────

async function navFPacientes(){
  const cacheAtual = (window._fisioCache||FISIO).filter(p=>p.status!=='alta'&&p.s!=='alta');
  renderFPacientes(cacheAtual);
  try {
    const [pacRows, sessRows] = await Promise.all([
      sbGet('pacientes_fisio','nome'),
      sbGet('sessoes_fisio','data_sessao').catch(()=>[])
    ]);

    // Agrupa datas por paciente_id
    const datasMap = {};
    sessRows.forEach(s=>{
      if(!datasMap[s.paciente_id]) datasMap[s.paciente_id]=[];
      if(s.data_sessao){
        // Parseia diretamente sem new Date() para evitar problema de timezone
        const iso = String(s.data_sessao).split('T')[0];
        const [y,m,d] = iso.split('-');
        datasMap[s.paciente_id].push(d+'/'+m+'/'+y.slice(2));
      }
    });

    // Verifica e dá alta automática para quem completou
    const paraAltaAutomatica = pacRows.filter(r=>
      r.status !== 'alta' &&
      r.sessoes_contratadas &&
      (r.sessoes_realizadas||0) >= r.sessoes_contratadas
    );

    // Dá alta em paralelo para quem completou
    if(paraAltaAutomatica.length > 0){
      await Promise.all(paraAltaAutomatica.map(r=>
        sbUpdate('pacientes_fisio', r.id, {status:'alta'}).catch(()=>{})
      ));
      // Atualiza status localmente
      paraAltaAutomatica.forEach(r=>{ r.status='alta'; });
    }

    const merged = pacRows.map(r=>({
      id:r.id, n:r.nome, tel:r.telefone,
      sessoes:r.sessoes_contratadas,
      realizadas:r.sessoes_realizadas||0,
      status:r.status||'ativo',
      s:r.status||'ativo',
      datas: datasMap[r.id]||[]
    }));

    window._fisioCache = merged;
    const ativos = merged.filter(p=>p.status!=='alta');
    window._fisioListaAtual = ativos;
    renderFPacientes(ativos);
  } catch(e){ console.warn('Supabase pacientes:', e.message); }
}

function renderLVendas(all){
  const agora = new Date();
  const mesAtual = agora.getMonth()+1;
  const anoAtual = agora.getFullYear();

  // Normaliza data para dd/mm/aa independente do formato
  function normData(data){
    if(!data||data==='—'||data==='null'||data===null) return null;
    const s = String(data);
    // formato ISO: 2026-05-26 → 26/05/26
    if(s.match(/^\d{4}-\d{2}-\d{2}/)){
      const [y,m,d] = s.split('T')[0].split('-');
      return d+'/'+m+'/'+y.slice(2);
    }
    return s; // já está em dd/mm/aa
  }

  function getMesAnoNum(data){
    const d = normData(data);
    if(!d) return null;
    const p = d.split('/');
    if(p.length<3) return null;
    return { mes:parseInt(p[1]), ano:parseInt('20'+p[2]) };
  }

  // Agrupa por mês
  const porMes = {};
  all.forEach(v=>{
    const ma = getMesAnoNum(v.data);
    if(!ma) return;
    const key = String(ma.mes).padStart(2,'0')+'/'+ma.ano;
    if(!porMes[key]) porMes[key]={total:0,qtd:0};
    porMes[key].total += parseFloat(v.preco)||0;
    porMes[key].qtd++;
  });
  const mesesOrdenados = Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0]));

  // Mês atual
  const mesAtualKey = String(mesAtual).padStart(2,'0')+'/'+anoAtual;
  const vendasMes = all.filter(v=>{
    const ma = getMesAnoNum(v.data);
    return ma && ma.mes===mesAtual && ma.ano===anoAtual;
  });
  const totalMes   = vendasMes.reduce((s,v)=>s+(parseFloat(v.preco)||0),0);
  const totalGeral = all.reduce((s,v)=>s+(parseFloat(v.preco)||0),0);

  const marcas=[...new Set(all.map(v=>v.marca||'—').filter(m=>m&&m!=='null'))].sort();
  const lista=all.filter(v=>
    (!ft||(v.item||'').toLowerCase().includes(ft.toLowerCase())||(v.cliente||'').toLowerCase().includes(ft.toLowerCase()))&&
    (!filM||v.marca===filM)
  );
  const tot=lista.reduce((s,v)=>s+(parseFloat(v.preco)||0),0);

  // Salva índices globais para edição
  window._vendasLista = lista;

  set(
    '<div class="pt">Vendas</div>'+
    '<div class="ps">'+all.length+' itens · '+fR(totalGeral)+' faturado total</div>'+

    '<div class="metrics3" style="margin-bottom:18px">'+
    mc('Faturamento total','vp',fR(totalGeral),all.length+' vendas')+
    mc('Mês atual ('+mesAtual+'/'+anoAtual+')','vg',fR(totalMes),vendasMes.length+' vendas · parcial')+
    mc('Ticket médio','va',all.length?fR(Math.round(totalGeral/all.length)):'—','por venda')+
    '</div>'+

    '<div style="font-size:11px;font-weight:600;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Faturamento por mês</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">'+
    mesesMesOrdenados(mesesOrdenados, mesAtualKey)+
    '</div>'+

    '<div class="tb">'+

function mesesMesOrdenados(meses, mesAtualKey){
  const nomesMes = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses.slice(0,6).map(([key,dados])=>{
    const [mm,yyyy] = key.split('/');
    const isAtual = key===mesAtualKey;
    return `<div style="background:${isAtual?'rgba(201,169,110,.15)':'var(--glass)'};border:1px solid ${isAtual?'var(--border-str)':'var(--border)'};border-radius:10px;padding:10px 14px;min-width:100px;text-align:center;box-shadow:var(--shadow-sm)">
      <div style="font-size:10px;color:var(--brown-light);font-weight:700;text-transform:uppercase;letter-spacing:.06em">${nomesMes[parseInt(mm)]||mm}/${yyyy.slice(2)}${isAtual?' <span style="color:var(--gold-dark)">●</span>':''}</div>
      <div style="font-size:16px;font-weight:700;color:var(--brown);margin-top:4px">${fR(dados.total)}</div>
      <div style="font-size:10px;color:var(--brown-light);margin-top:2px">${dados.qtd} vendas</div>
    </div>`;
  }).join('');
}

function abrirEditarVenda(idx){
  const v = (window._vendasLista||window._vendasCache||VENDAS)[idx];
  if(!v) return;
  window._vendaEditando = v;
  window._vendaEditIdx = idx;

  function normData(data){
    if(!data||data==='—'||data==='null'||data===null) return '';
    const s = String(data);
    if(s.match(/^\d{4}-\d{2}-\d{2}/)){
      const [y,m,d] = s.split('T')[0].split('-');
      return d+'/'+m+'/'+y.slice(2);
    }
    return s;
  }

  abrirModal(
    '<div class="mdt"><i class="ti ti-pencil" style="margin-right:8px;color:var(--gold-dark)"></i>Editar venda</div>'+
    '<label class="fl">Item *</label><input class="fi" id="vd_item" value="'+esc(v.item||'')+'">'+
    '<div class="fr2"><div><label class="fl">Marca</label><select class="fi" id="vd_marca">'+
      ['Rosa Imperial','Camomila','Mnovo','Mantig','ALAD Amanda','Lm'].map(m=>'<option'+(v.marca===m?' selected':'')+'>'+m+'</option>').join('')+
    '</select></div>'+
    '<div><label class="fl">Tamanho</label><input class="fi" id="vd_tam" value="'+(v.tam||v.tamanho||'')+'"></div></div>'+
    '<div class="fr3">'+
    '<div><label class="fl">Custo R$</label><input class="fi" id="vd_custo" type="number" value="'+(v.custo||'')+'"></div>'+
    '<div><label class="fl">Preço R$</label><input class="fi" id="vd_preco" type="number" value="'+(v.preco||'')+'"></div>'+
    '<div><label class="fl">Desconto %</label><input class="fi" id="vd_desc" type="number" value="0"></div></div>'+
    '<div class="fr2"><div><label class="fl">Cliente</label><input class="fi" id="vd_cliente" value="'+esc(v.cliente&&v.cliente!=='null'?v.cliente:'')+'"></div>'+
    '<div><label class="fl">Data (dd/mm/aa)</label><input class="fi" id="vd_data" value="'+normData(v.data)+'"></div></div>'+
    '<div class="fr2"><div><label class="fl">Forma pgto</label><select class="fi" id="vd_pgto">'+
      ['PIX','Cartão débito','Cartão crédito 2x','Dinheiro','Link de pgto'].map(p=>'<option'+(v.pgto===p?' selected':'')+'>'+p+'</option>').join('')+
    '</select></div>'+
    '<div><label class="fl">Vendedor(a)</label><select class="fi" id="vd_vendedor">'+
      '<option value="">— Selecione —</option>'+
      ['Vitoria','Larissa','Outro'].map(vd=>'<option value="'+vd+'"'+(v.vendedor===vd?' selected':'')+'>'+vd+'</option>').join('')+
    '</select></div></div>'+
    '<div style="border-top:1px solid var(--border);margin:8px 0 12px;padding-top:12px">'+
    '<div style="font-size:11px;font-weight:600;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Adicionar item à mesma venda</div>'+
    '<div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end">'+
    '<input class="fi" id="vd_item_extra" placeholder="Nome do item extra (opcional)" style="margin-bottom:0">'+
    '<button class="btn btns btnp" onclick="adicionarItemVenda()" style="height:38px">+ Add</button>'+
    '</div>'+
    '<div id="vd_itens_extra" style="margin-top:6px"></div>'+
    '</div>'+
    '<div class="mdf">'+
    '<button class="btn" style="color:#8B2E1A;border-color:rgba(139,46,26,.3)" onclick="excluirVenda()"><i class="ti ti-trash"></i> Excluir</button>'+
    '<button class="btn" onclick="fecharModal()">Cancelar</button>'+
    '<button class="btn btnp" id="vd_btn" onclick="salvarEdicaoVenda()"><i class="ti ti-check"></i> Salvar</button>'+

function adicionarItemVenda(){
  const item = document.getElementById('vd_item_extra').value.trim();
  if(!item) return;
  window._vendaItensExtra = window._vendaItensExtra||[];
  window._vendaItensExtra.push(item);
  document.getElementById('vd_item_extra').value='';
  const el = document.getElementById('vd_itens_extra');
  el.innerHTML = window._vendaItensExtra.map((it,i)=>
    `<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(184,146,74,.1);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;margin:2px">
      ${it} <span onclick="window._vendaItensExtra.splice(${i},1);adicionarItemVenda();document.getElementById('vd_item_extra').value=''" style="cursor:pointer;color:var(--brown-light)">×</span>
    </span>`
  ).join('');
}

async function salvarEdicaoVenda(){
  const v = window._vendaEditando;
  if(!v) return;
  const btn = document.getElementById('vd_btn'); btn.disabled=true; btn.textContent='Salvando…';
  const preco = parseFloat(document.getElementById('vd_preco').value)||0;
  const desc  = parseFloat(document.getElementById('vd_desc').value)||0;
  const vf    = desc>0 ? preco*(1-desc/100) : preco;

  const dados = {
    item:      document.getElementById('vd_item').value.trim(),
    marca:     document.getElementById('vd_marca').value,
    tamanho:   document.getElementById('vd_tam').value||null,
    custo:     parseFloat(document.getElementById('vd_custo').value)||null,
    preco:     vf,
    cliente:   document.getElementById('vd_cliente').value||null,
    data_venda:document.getElementById('vd_data').value||null,
    forma_pgto:document.getElementById('vd_pgto').value||null,
    vendedor:  document.getElementById('vd_vendedor')?.value||null,
    participacao_vitoria:(()=>{
      const vend = document.getElementById('vd_vendedor')?.value;
      if(vend==='Vitoria') return 'atendeu';
      const radio = document.querySelector('input[name="vd_vitpart"]:checked');
      return (radio&&radio.value!=='nao') ? radio.value : 'nao';
    })(),
  };

  try {
    // Atualiza venda principal
    if(v.id) await sbUpdate('vendas', v.id, dados);

    // Insere itens extras como novas vendas ligadas ao mesmo cliente/data
    const itensExtra = window._vendaItensExtra||[];
    for(const item of itensExtra){
      await sbInsert('vendas',{...dados, item, custo:null, preco:0});
    }

    await registrarLog('editou venda','vendas', dados.item+(itensExtra.length?' + '+itensExtra.length+' item(ns)':''));
    fecharModal();
    navLVendas();
  } catch(e){ btn.disabled=false; btn.textContent='Salvar'; alert('Erro: '+e.message); }
}

async function navLEstoque(){
  window._estoqueCache = ESTOQUE;
  renderLEstoque(ESTOQUE);
  try {
    const rows = await sbGet('estoque','item');
    if(rows.length > 0){
      const all = rows.map(r=>({
        id:           r.id,
        item:         r.item,
        tam:          r.tamanho||'—',
        qtd:          r.quantidade||0,
        marca:        r.marca||null,
        custo:        r.custo||null,
        preco:        r.preco||null,
        codigo_barras:r.codigo_barras||null
      }));
      window._estoqueCache = all;
      renderLEstoque(all);
    } else {
      // banco vazio — mostra ESTOQUE local (array vazio)
      window._estoqueCache = [];
      renderLEstoque([]);
    }
  } catch(e){ console.warn('Supabase estoque:', e.message); }
}

function renderLEstoque(all){
  const total=all.reduce((s,e)=>s+qtdN(e.qtd),0);
  const zeros=all.filter(e=>qtdN(e.qtd)===0).length;
  const baixo=all.filter(e=>qtdN(e.qtd)===1).length; // alerta estoque mínimo
  const valorVenda = all.reduce((s,e)=>s+(qtdN(e.qtd)*(parseFloat(e.preco)||0)),0);
  const valorCusto = all.reduce((s,e)=>s+(qtdN(e.qtd)*(parseFloat(e.custo)||0)),0);
  const lucroEstimado = valorVenda - valorCusto;
  const lista=all.filter(e=>!ft||(e.item||'').toLowerCase().includes(ft.toLowerCase())||(e.marca||'').toLowerCase().includes(ft.toLowerCase()));

  // ── Margem por marca ──────────────────────────────────────
  const porMarca={};
  all.forEach(e=>{
    if(!e.marca) return;
    if(!porMarca[e.marca]) porMarca[e.marca]={venda:0,custo:0,qtd:0};
    const q=qtdN(e.qtd);
    porMarca[e.marca].venda += (parseFloat(e.preco)||0)*q;
    porMarca[e.marca].custo += (parseFloat(e.custo)||0)*q;
    porMarca[e.marca].qtd   += q;
  });
  const marcasMargens = Object.entries(porMarca)
    .map(([m,d])=>({marca:m,...d, margem:d.venda>0?((d.venda-d.custo)/d.venda*100):0}))
    .sort((a,b)=>b.margem-a.margem);

  set('<div class="pt">Estoque</div><div class="ps">'+all.length+' modelos · '+total+' unidades · '+zeros+' zeradas'+(baixo>0?' · <span style="color:#E67E22">⚠ '+baixo+' com apenas 1 un.</span>':'')+'</div>'+

  // Alerta estoque baixo
  (baixo>0?
  '<div style="background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.3);border-radius:var(--r-md);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px">'+
  '<i class="ti ti-alert-triangle" style="color:#E67E22;font-size:20px;flex-shrink:0"></i>'+
  '<div><div style="font-size:13px;font-weight:600;color:#E67E22">'+baixo+' peça(s) com apenas 1 unidade em estoque</div>'+
  '<div style="font-size:12px;color:var(--text-2)">'+all.filter(e=>qtdN(e.qtd)===1).map(e=>e.item).slice(0,4).join(', ')+(baixo>4?' +mais':'')+'</div></div></div>':'')+ 

  '<div class="metrics3">'+mc('Total em estoque','vi',total,'unidades')+mc('Zeradas','vr',zeros,'sem estoque')+mc('Modelos','vg',all.length,'cadastrados')+'</div>'+
  '<div class="metrics3">'+
  mc('Valor em estoque (venda)','vg',fR(valorVenda),'se vender tudo')+
  mc('Valor investido (custo)','va',fR(valorCusto),'capital empatado')+
  mc('Lucro potencial','vi',fR(lucroEstimado),'venda − custo')+
  '</div>'+

  // Margem por marca
  (marcasMargens.length?
  '<div class="dp" style="padding:16px;margin-bottom:14px">'+
  '<div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px"><i class="ti ti-chart-bar"></i> Margem por marca</div>'+
  '<div style="display:flex;flex-direction:column;gap:8px">'+
  marcasMargens.map(m=>{
    const cor = m.margem>=50?'#2D7A3A':m.margem>=30?'var(--gold-dark)':'#C0392B';
    return '<div style="display:flex;align-items:center;gap:10px">'+
    '<div style="width:110px;font-size:12px;font-weight:600;color:var(--text-1);flex-shrink:0">'+m.marca+'</div>'+
    '<div style="flex:1;height:6px;background:var(--bg-2);border-radius:3px">'+
    '<div style="width:'+Math.min(m.margem,100)+'%;height:100%;border-radius:3px;background:'+cor+'"></div></div>'+
    '<div style="font-size:12px;font-weight:700;color:'+cor+';width:40px;text-align:right">'+Math.round(m.margem)+'%</div>'+
    '<div style="font-size:11px;color:var(--text-3);width:80px">'+fR(m.venda-m.custo)+' lucro</div>'+
    '</div>';
  }).join('')+
  '</div></div>':'')+ 

  '<div class="tb"><input class="srch" placeholder="Buscar peça ou marca…" oninput="ft=this.value;renderLEstoque(window._estoqueCache||[])" value="'+ft+'">'+
  '<div style="margin-left:auto;display:flex;gap:8px">'+
  '<button class="btn" onclick="abrirBipagemEstoque()"><i class="ti ti-barcode"></i> Bipar entrada</button>'+
  '<button class="btn btnb" onclick="nav(\'l_entrada\')"><i class="ti ti-package-import"></i> Entrada em lote</button>'+
  '<button class="btn btnp" onclick="abrirNovaPeca()"><i class="ti ti-plus"></i> Nova peça</button></div></div>'+

  // Cards com indicador de giro
  '<div class="card-grid">'+
  lista.map(e=>{
    const q=qtdN(e.qtd); const cls=q===0?'s0':q<=1?'slow':'sok';
    const margem = e.preco&&e.custo ? ((e.preco-e.custo)/e.preco*100).toFixed(0) : null;
    return '<div class="prod-card '+cls+'" onclick="abrirEditarPeca(\''+esc(e.item||'')+'\')">'+
    '<div class="pn">'+e.item+'</div>'+
    (e.marca?'<div style="font-size:10px;font-weight:600;color:var(--gold-dark);margin-bottom:2px">'+e.marca+'</div>':'')+
    '<div class="pm">'+e.tam+(e.preco?' · R$ '+e.preco:'')+(margem?' · <span style="color:'+(parseInt(margem)>=40?'#2D7A3A':'#E67E22')+'">'+margem+'% mg</span>':'')+'</div>'+
    '<div class="pt2">'+
    (q===1?'<span class="bdg ba">⚠ última unidade</span>':'')+
    '<span class="bdg '+(q===0?'br':q<=1?'ba':'bg')+'">'+(q===0?'Sem estoque':q+' un.')+'</span>'+
    '</div></div>';
  }).join('')+'</div>');
}

async function navLClientes(){
  loading('Carregando clientes…');
  try {
    const [vRows, encRows] = await Promise.all([sbGet('vendas','criado_em'), sbGet('encomendas','criado_em')]);
    const dbVIds = new Set(vRows.map(r=>r.id));
    const allV=[...vRows.map(r=>({item:r.item,cliente:r.cliente,preco:r.preco})),...VENDAS.filter(v=>!dbVIds.has(v.id))];
    const dbEIds = new Set(encRows.map(r=>r.id));
    const allEnc=[...encRows.map(r=>({item:r.item,cliente:r.cliente,vf:r.valor_final,preco:r.preco_tabela})),...ENCOMENDAS.filter(e=>!dbEIds.has(e.id))];
    const map={};
    allV.forEach(v=>{const c=v.cliente||'—';if(!map[c])map[c]={n:c,q:0,t:0,it:[]};map[c].q++;map[c].t+=parseFloat(v.preco)||0;map[c].it.push(v.item);});
    allEnc.forEach(e=>{const c=e.cliente||'—';if(!map[c])map[c]={n:c,q:0,t:0,it:[]};map[c].q++;map[c].t+=parseFloat(e.vf||e.preco)||0;map[c].it.push(e.item);});
    const lista=Object.values(map).filter(c=>!ft||c.n.toLowerCase().includes(ft.toLowerCase())).sort((a,b)=>b.t-a.t);
    set('<div class="pt">Clientes</div><div class="ps">'+lista.length+' clientes com compras</div>'+
    '<div class="tb"><input class="srch" placeholder="Buscar cliente…" oninput="ft=this.value;navLClientes()" value="'+ft+'"></div>'+
    '<div class="tw"><table><thead><tr><th>Cliente</th><th>Compras</th><th>Total</th><th>Últimos itens</th></tr></thead><tbody>'+
    lista.map(c=>'<tr><td><strong>'+c.n+'</strong></td><td>'+c.q+'</td><td style="color:#db2777;font-weight:500">'+fR(c.t)+'</td>'+
    '<td style="color:#666;max-width:240px;overflow:hidden;text-overflow:ellipsis">'+c.it.slice(-3).join(', ')+'</td></tr>').join('')+
    '</tbody></table></div>');
  } catch(e){ showErr(e.message); }
}

async function salvarAluno(){
  const nome = document.getElementById('ca_nome').value.trim();
  if(!nome){ document.getElementById('ca_erro').style.display='block'; document.getElementById('ca_nome').focus(); return; }
  const btn = document.querySelector('#mdl .btnb');

  try {
    await sbInsert('alunos',{
      status: document.getElementById('ca_status').value,
      nome,
      telefone: document.getElementById('ca_tel').value.trim()||null,
      plano: document.getElementById('ca_plano').value,
      horario: document.getElementById('ca_h').value.trim()||null,
      valor: parseFloat(document.getElementById('ca_v').value)||0,
      ultimo_pagto: document.getElementById('ca_pg').value.trim()||null,
      prox_vencto: document.getElementById('ca_px').value.trim()||null,
    });

// ── REGISTRAR PAGAMENTO NO BANCO ──────────────────────────
async function confirmarPagamento(){
  const aluno = document.getElementById('pg_aluno').value;
  const ref   = document.getElementById('pg_ref').value;
  const valor = parseFloat(document.getElementById('pg_val').value)||0;
  const forma = document.getElementById('pg_forma').value;
  if(!aluno||!valor){ alert('Preencha aluno e valor.'); return; }
  const btn=document.getElementById('pg_btn');
  if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }

  const hoje = new Date();
  const pad  = n=>String(n).padStart(2,'0');
  const dataStr = pad(hoje.getDate())+'/'+pad(hoje.getMonth()+1)+'/'+String(hoje.getFullYear()).slice(2);

  try {
    // 1. Salva o pagamento
    await sbInsert('pagamentos',{aluno_nome:aluno,referencia:ref,valor,forma_pgto:forma,data_pgto:dataStr});

    // 2. Busca o aluno no banco (ou insere se não existir) e atualiza datas
    let novoProx = null;
    try {
      // Busca direto pelo nome exato
      const r = await fetchWithTimeout(
        `${SB_URL}/rest/v1/alunos?nome=eq.${encodeURIComponent(aluno)}&limit=1`,
        { headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY} }
      );
      let lista = await r.json();
      let pac = lista[0];

      // Se não achou no banco, insere a partir dos dados locais
      if(!pac){
        const local = (window._alunosDB||AL).find(a=>a.n===aluno);
        if(local){
          const ins = await sbInsert('alunos',{
            status: local.s||'A', nome: local.n,
            telefone: local.tel||null, plano: local.pl||null,
            horario: local.h||null, valor: parseFloat(local.v)||0,
            ultimo_pagto: local.pg||null, prox_vencto: local.px||null,
          });
          pac = ins[0];
          console.log('Aluno inserido no banco:', pac?.nome);
        }
      }

      if(pac){
        let diaVenc = 10;
        const fonteData = pac.prox_vencto || pac.ultimo_pagto;
        if(fonteData && fonteData !== 'parceria'){
          const partes = fonteData.split('/');
          if(partes.length >= 2){
            const diaParseado = parseInt(partes[0]);
            if(diaParseado > 0 && diaParseado <= 31) diaVenc = diaParseado;
          }
        }

        let mesProx, anoProx;
        if(pac.prox_vencto && pac.prox_vencto !== 'parceria'){
          const p = pac.prox_vencto.split('/');
          if(p.length >= 3){
            const mesVenc = parseInt(p[1]) - 1;
            const anoVenc = parseInt('20' + p[2]);
            const proxData = new Date(anoVenc, mesVenc + 1, 1);
            mesProx = proxData.getMonth();
            anoProx = proxData.getFullYear();
          }
        }
        if(mesProx === undefined){
          mesProx = (hoje.getMonth() + 1) % 12;
          anoProx = hoje.getMonth() === 11 ? hoje.getFullYear() + 1 : hoje.getFullYear();
        }

        const dataFinal = new Date(anoProx, mesProx, diaVenc);
        if(dataFinal.getMonth() !== mesProx) dataFinal.setDate(0);
        novoProx = pad(dataFinal.getDate())+'/'+pad(dataFinal.getMonth()+1)+'/'+String(dataFinal.getFullYear()).slice(2);

        await sbUpdate('alunos', pac.id, { ultimo_pagto: dataStr, prox_vencto: novoProx });
        console.log('Banco atualizado ✓ próx:', novoProx);
      }
    } catch(e2){ console.warn('Update aluno banco:', e2.message); }

    // 3. Atualiza cache local em TODOS os lugares
    const atualizarTodosCache = (nome, pg, px) => {
      [AL, window._alunosDB||[]].forEach(lista=>{
        const a = lista.find(x=>x.n===nome);
        if(a){ a.pg=pg; if(px) a.px=px; }
      });
    };
    atualizarTodosCache(aluno, dataStr, novoProx);

    await registrarLog('registrou pagamento','pagamentos', aluno+' — '+fR(valor)+' ref. '+ref+' | próx: '+(novoProx||'—'));
    fecharModal();

    // 4. Recarrega sempre o financeiro para refletir o pagamento
    pg = 'p_fin';
    navPFin();

  } catch(e){ btn.disabled=false; btn.textContent='Confirmar'; alert('Erro: '+e.message); }
}

// ── REGISTRAR SESSÃO FISIO NO BANCO ───────────────────────
async function confirmarSessao(){
  const nome = document.getElementById('fs_nome')?.value;
  const data = document.getElementById('fs_data')?.value;
  const obs  = document.getElementById('fs_obs')?.value||null;
  const btn  = document.getElementById('fs_btn');
  if(!nome||!data){ alert('Preencha paciente e data.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  try {
    const rows = await sbGet('pacientes_fisio','id');
    const pac  = rows.find(r=>r.nome===nome);
    if(!pac){ alert('Paciente não encontrado no banco.'); btn.disabled=false; btn.textContent='Registrar'; return; }

    const novasRealizadas = (pac.sessoes_realizadas||0) + 1;

    // Formata data para salvar nas datas dd/mm/aa
    const dataFmt = data ? (()=>{
      const [y,m,d] = data.split('-');
      return d+'/'+m+'/'+y.slice(2);
    })() : null;

    // Busca datas já registradas — parseia sem timezone
    const sesoesAntigas = await sbGet('sessoes_fisio','id');
    const datasList = sesoesAntigas
      .filter(s=>s.paciente_id===pac.id)
      .map(s=>{
        if(!s.data_sessao) return '—';
        // Parseia diretamente do ISO sem usar new Date() para evitar timezone
        const iso = String(s.data_sessao).split('T')[0]; // pega só 2026-07-22
        const [y,m,d] = iso.split('-');
        return d+'/'+m+'/'+y.slice(2);
      })
      .concat(dataFmt||'—');

    // Registra sessão
    await sbInsert('sessoes_fisio',{
      paciente_id: pac.id,
      paciente_nome: nome,
      data_sessao: data,
      observacao: obs
    });

    // Verifica se completou o plano → alta automática
    const completou = pac.sessoes_contratadas && novasRealizadas >= pac.sessoes_contratadas;

    await sbUpdate('pacientes_fisio', pac.id, {
      sessoes_realizadas: novasRealizadas,
      ...(completou ? {status:'alta'} : {})
    });

    // Atualiza cache
    if(window._fisioCache){
      const i = window._fisioCache.findIndex(x=>x.n===nome);
      if(i>=0){
        window._fisioCache[i].realizadas = novasRealizadas;
        window._fisioCache[i].datas = datasList;
        if(completou){ window._fisioCache[i].status='alta'; window._fisioCache[i].s='alta'; }
      }
    }

    await registrarLog('registrou sessão','sessoes_fisio','Sessão de '+nome+' em '+(dataFmt||data)+(completou?' — PLANO COMPLETO → ALTA':'')+( obs?' | '+obs:''));
    fecharModal();

    if(completou){
      // Mostra aviso de alta automática e vai para o dashboard
      setTimeout(()=>{
        abrirModal(
          '<div style="text-align:center;padding:8px">'+
          '<div style="width:56px;height:56px;border-radius:50%;background:#E8F5EC;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">'+
          '<i class="ti ti-user-check" style="font-size:28px;color:#2D7A3A"></i></div>'+
          '<div style="font-family:var(--font-serif);font-size:20px;font-weight:600;margin-bottom:8px">Plano concluído!</div>'+
          '<div style="font-size:13px;color:var(--text-2);margin-bottom:16px">'+
          '<strong>'+nome+'</strong> completou todas as '+pac.sessoes_contratadas+' sessões e foi automaticamente movido para "Com alta".</div>'+
          '<div class="mdf" style="justify-content:center">'+
          '<button class="btn btne" onclick="fecharModal();navFPacientes()">Ver pacientes</button>'+
          '</div></div>'
        );
      },200);
    } else {
      // Volta para a ficha do paciente atualizada
      window._fisioCache = null;
      navFPacientes();
    }
  } catch(e){ btn.disabled=false; btn.textContent='Registrar'; alert('Erro: '+e.message); }
}

async function confirmarVenda(){
  const cart = window._carrinho||[];
  if(!cart.length){ alert('Adicione pelo menos 1 item.'); return; }

  const btn=document.getElementById('vd_btn');
  btn.disabled=true; btn.textContent='Salvando…';

  const cliente  = document.getElementById('vd_cliente').value||null;
  const data     = document.getElementById('vd_data').value||null;
  const pgto     = document.getElementById('vd_pgto').value||null;
  const vendedor = document.getElementById('vd_vendedor')?.value||null;
  const partVit  = (()=>{
    if(vendedor==='Vitoria') return 'atendeu';
    const radio = document.querySelector('input[name="vd_vitpart"]:checked');
    return (radio&&radio.value!=='nao') ? radio.value : 'nao';
  })();

  try {
    // Salva cada item como uma linha separada na tabela vendas
    // mas todos com mesmo cliente/data/pgto (mesma "sessão de compra")
    for(const v of cart){
      await sbInsert('vendas',{
        item:            v.item,
        marca:           v.marca||null,
        tamanho:         v.tam||null,
        preco:           v.preco,
        cliente,
        data_venda:      data,
        forma_pgto:      pgto,
        vendedor,
        participacao_vitoria: partVit,
        codigo_barras:   v.codigo||null,
      });

      // Baixa no estoque se tiver código
      if(v.codigo){
        try {
          const r = await fetchWithTimeout(
            `${SB_URL}/rest/v1/estoque?codigo_barras=eq.${encodeURIComponent(v.codigo)}&limit=1`,
            {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
          );
          const lista = await r.json();
          if(lista[0]&&lista[0].quantidade>0){
            await sbUpdate('estoque', lista[0].id, {quantidade: lista[0].quantidade-1});
          }
        } catch(e){ console.warn('Baixa estoque:', e.message); }
      }
    }

    const total = cart.reduce((s,v)=>s+v.preco,0);
    const itens = cart.map(v=>v.item).join(', ');
    await registrarLog('registrou venda','vendas',
      cart.length+' item(ns): '+itens+' — '+fR(total)+' para '+(cliente||'—'));
    fecharModal();
    navLVendas();
  } catch(e){ btn.disabled=false; btn.textContent='Finalizar venda'; alert('Erro: '+e.message); }
}

function atualizarPrecoAvulsa(dataStr){
  if(!dataStr) return;
  const hoje = new Date();
  const [y,m] = dataStr.split('-').map(Number);

  const isProximoMes = y > hoje.getFullYear() || (y === hoje.getFullYear() && m > hoje.getMonth()+1);
  const campo = document.getElementById('av_valor');
  if(campo) campo.value = isProximoMes ? 180 : 160;
}

async function buscarPecaCarrinho(codigo){
  if(!codigo||!codigo.trim()) return;
  codigo = codigo.trim();
  const res = document.getElementById('vd_codigo_result');
  try {
    const r = await fetchWithTimeout(
      `${SB_URL}/rest/v1/estoque?codigo_barras=eq.${encodeURIComponent(codigo)}&limit=1`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}
    );
    const lista = await r.json();
    if(lista[0]){
      const p = lista[0];
      // Preenche campos automaticamente
      document.getElementById('vd_item').value = p.item||'';
      if(p.marca){
        const sel = document.getElementById('vd_marca');
        for(let o of sel.options) if(o.value===p.marca){o.selected=true;break;}
      }
      if(p.preco) document.getElementById('vd_preco').value = p.preco;
      if(res) res.innerHTML = `<div style="font-size:11px;background:rgba(45,122,58,.08);border:1px solid rgba(45,122,58,.2);border-radius:6px;padding:5px 10px;color:#2D7A3A">✓ ${p.item} — estoque: ${p.quantidade||0} un.</div>`;
      window._vendaCodigoBarras = codigo;
      window._vendaPecaId = p.id;
    } else {
      if(res) res.innerHTML = `<div style="font-size:11px;color:#C0392B">Código não encontrado — preencha manualmente.</div>`;
    }
  } catch(e){}
}

// ── AGENDA (grade local — usa dados em memória) ───────────
// Mapeia cor do Google Calendar para tipo
// Verde (10 = "sage", 2 = "basil") = Pilates
// Azul (1,7,9) = Fisio
// colorId null no calendário "Estudio Lm" = também Pilates
function tipoEvento(ev){
  const titulo = (ev.summary||'').toLowerCase();
  if(titulo.startsWith('fisio') || ev.colorId==='1'||ev.colorId==='7'||ev.colorId==='9') return 'fisio';
  return 'pilates';
}

// Converte horário do Google (ex: "2026-05-25T07:00:00-03:00") para chave da grade ("07H")
function horaParaChave(dateTimeStr){
  if(!dateTimeStr) return null;
  const d = new Date(dateTimeStr);
  return String(d.getHours()).padStart(2,'0')+'H';
}

// Converte dia da semana do Google para abreviação da grade
function diaParaChave(dateTimeStr){
  if(!dateTimeStr) return null;
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  return dias[new Date(dateTimeStr).getDay()];
}

// Extrai lista de nomes do título do evento
// "Ana G, Araci, Paula" → ["Ana G","Araci","Paula"]
function extrairNomes(titulo){
  return titulo
    .split(',')
    .map(n=>n.trim())
    .filter(n=>n.length>1 && !n.toLowerCase().startsWith('fisio'));
}

async function rPAgenda(){
  // Mostra grade local imediatamente
  renderGrade(GD, false);

  // Se Google conectado, tenta sincronizar
  if(!gcalToken){ return; }

  // Atualiza indicador
  const ps = document.querySelector('.ps');
  if(ps) ps.innerHTML = 'Sincronizando com Google Agenda <span style="color:var(--gold-dark)">⏳</span>';

  try {
    // Busca o calendário "Estudio Lm"
    const cals = await gcalListCalendars();
    const estudioCal = cals.find(c=>c.summary.toLowerCase().includes('estudio')||c.summary.toLowerCase().includes('estúdio')||c.summary.toLowerCase().includes('lm'));
    const calId = estudioCal ? estudioCal.id : 'primary';

    // Pega próxima semana completa (Seg a Sáb)
    const hoje = new Date();
    const seg = new Date(hoje);
    seg.setDate(hoje.getDate() - hoje.getDay() + 1); // próxima segunda
    seg.setHours(0,0,0,0);
    const sabado = new Date(seg);
    sabado.setDate(seg.getDate()+6);
    sabado.setHours(23,59,59,0);

    const eventos = await gcalListEvents(calId, seg.toISOString(), sabado.toISOString());

    // Monta grade a partir dos eventos
    const gdGoogle = {};
    DIAS.forEach(d=>HORAS.forEach(h=>gdGoogle[d+'-'+h]=[]));

    const eventosFisio = [];

    eventos.forEach(ev=>{
      const tipo = tipoEvento(ev);
      const inicio = ev.start?.dateTime||ev.start?.date;
      if(!inicio) return;

      const dia = diaParaChave(inicio);
      const hora = horaParaChave(inicio);
      if(!dia||!hora) return;

      const chaveHora = hora; // ex: "07H"
      const key = dia+'-'+chaveHora;

      if(tipo==='pilates'){
        const nomes = extrairNomes(ev.summary||'');
        if(nomes.length && gdGoogle[key]!==undefined){
          gdGoogle[key].push(...nomes);
        } else if(gdGoogle[key]!==undefined && ev.summary){
          // evento sem vírgula = nome único
          gdGoogle[key].push(ev.summary.trim());
        }
      } else if(tipo==='fisio'){
        eventosFisio.push({
          nome: (ev.summary||'').replace(/fisio\s*/i,'').trim(),
          inicio, dia, hora: chaveHora,
          titulo: ev.summary
        });
      }
    });

    // Merge: para células que a Google não cobriu, usa dados da planilha
    DIAS.forEach(d=>HORAS.forEach(h=>{
      const key=d+'-'+h;
      if(gdGoogle[key]===undefined) gdGoogle[key]=[];
      if(gdGoogle[key].length===0 && GD[key] && GD[key].length>0){
        gdGoogle[key] = [...GD[key]]; // fallback para dados da planilha
      }
    }));

    // Guarda fisio da agenda globalmente
    window._fisioAgenda = eventosFisio;

    renderGrade(gdGoogle, true, estudioCal?.summary||'Estudio Lm', eventos.length, eventosFisio.length);

  } catch(e){
    console.warn('Google Agenda erro:', e.message);
    renderGrade(GD, false);
    const ps2 = document.querySelector('.ps');
    if(ps2) ps2.innerHTML = 'Dados locais · <span style="color:#8B2E1A;font-size:11px">Google Agenda indisponível</span>';
  }
}

  const fonte = fromGoogle
    ? '● Google Agenda <span style="color:var(--brown-light);font-size:11px">— '+calNome+' · '+totalEv+' eventos · '+totalFisio+' fisio</span>'
    : '● Dados da planilha <span style="color:var(--brown-light);font-size:11px">— conecte o Google para sincronizar</span>';

  let h='<div class="pt">Grade de Aulas</div>'+
  '<div class="ps">'+fonte+'</div>'+
  '<div style="display:flex;gap:14px;font-size:11px;margin-bottom:14px;flex-wrap:wrap;align-items:center">'+
  '<span style="display:flex;gap:5px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:rgba(92,122,46,.15);border:1px solid rgba(92,122,46,.3);display:inline-block"></span>Turma cheia</span>'+
  '<span style="display:flex;gap:5px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:rgba(201,169,110,.12);border:1px solid rgba(201,169,110,.3);display:inline-block"></span>Com vaga</span>'+
  '<span style="display:flex;gap:5px;align-items:center"><span style="width:10px;height:10px;border-radius:2px;background:var(--cream-dark);border:1px solid var(--border);display:inline-block"></span>Sem aula</span>'+
  (fromGoogle?'<button class="btn btns" style="margin-left:auto" onclick="rPAgenda()"><i class="ti ti-refresh"></i> Atualizar da agenda</button>':

  '</div>'+
  '<div class="sg"><div class="sgh"><div>Hr</div>'+DIAS.map(d=>'<div>'+d+'</div>').join('')+'</div>';

  HORAS.forEach(hr=>{
    h+='<div class="sgr"><div class="stl">'+hr+'</div>';
    DIAS.forEach(d=>{
      const key=d+'-'+hr;
      const aula=gradeData[key]||[];
      if(!aula.length){
        h+='<div class="sl"><div style="display:flex;align-items:center;justify-content:center;height:100%"><span class="sf">–</span></div></div>';
      } else {
        const fu=aula.length>=CAP;
        h+='<div class="sl '+(fu?'sfu':'spa')+'" onclick="verTurmaGoogle(\''+d+'\',\''+hr+'\',\''+encodeURIComponent(JSON.stringify(aula))+'\')">';
        aula.slice(0,3).forEach(nm=>h+='<span class="'+(fu?'sn':'sp')+'">'+nm.split(' ')[0]+'</span>');
        if(aula.length>3) h+='<span class="sc">+'+( aula.length-3)+'</span>';
        else h+='<span class="sc">'+aula.length+'/'+CAP+'</span>';
        h+='</div>';
      }
    });
    h+='</div>';
  });

  set(h+'</div>'+
  // Seção Fisio da agenda
  (fromGoogle && window._fisioAgenda && window._fisioAgenda.length ?
    '<div style="margin-top:18px"><div style="font-size:11px;font-weight:600;color:#4285F4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px"><i class="ti ti-heart-rate-monitor"></i> Fisioterapia esta semana — da agenda</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">'+
    window._fisioAgenda.map(f=>'<div style="background:rgba(66,133,244,.06);border:1px solid rgba(66,133,244,.2);border-radius:10px;padding:10px 12px">'+
      '<div style="font-size:13px;font-weight:500;color:var(--brown)">'+f.nome+'</div>'+
      '<div style="font-size:11px;color:var(--brown-light);margin-top:2px">'+f.dia+' · '+f.hora+'</div></div>').join('')+
    '</div></div>'
  : '')
  );
}

function verTurmaGoogle(d, hr, alunosEnc){
  const aula = JSON.parse(decodeURIComponent(alunosEnc));

  abrirModal(
    '<div class="mdt">'+d+' – '+hr+'</div>'+
    '<div style="margin-bottom:12px"><span class="bdg '+(livre===0?'bg':'ba')+'">'+aula.length+'/'+CAP+' alunos</span>'+
    (livre>0?' <span style="font-size:11px;color:var(--gold-dark)">'+livre+' vaga(s) livre</span>':'')+
    (gcalToken?' <span style="font-size:10px;color:rgba(66,133,244,.8)">● Google Agenda</span>':'')+
    '</div>'+
    aula.map(nm=>'<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--brown)">'+nm+'</div>').join('')+

    '<div class="mdf">'+

  );
}

function verTurma(d,hr){
  const aula=GD[d+'-'+hr]||[], livre=CAP-aula.length;
  verTurmaGoogle(d,hr,encodeURIComponent(JSON.stringify(aula)));
}

function abrirModal(h){
  const mdl = document.getElementById('mdl');
  const ovl = document.getElementById('ovlbg');
  if(!mdl||!ovl){ console.error('Modal elements not found'); return; }
  mdl.innerHTML = h;
  ovl.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  setTimeout(()=>{ mdl.scrollTop = 0; ovl.scrollTop = 0; }, 10);
}
function fecharModal(){
  const ovl = document.getElementById('ovlbg');
  if(ovl) ovl.style.display = 'none';
  document.body.style.overflow = '';
}
